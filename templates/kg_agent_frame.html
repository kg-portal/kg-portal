{% extends "base.html" %}
{% block content %}
<style>
    /* ===== PREMIUM (einheitliches Design) ===== */
    /* Inline-Stile der Seite bleiben stehen – hier nur überlagert (darum !important) */
    .kga-kopf { position: relative; overflow: hidden; display: grid !important; grid-template-columns: minmax(0, 1fr) auto; align-items: center;
        gap: 4px 18px !important; margin-bottom: 16px !important; padding: 24px 28px; border-radius: 24px; box-shadow: 0 24px 50px -28px rgba(29,78,216,.7);
        background: radial-gradient(520px 230px at 90% -20%, rgba(255,255,255,.26), transparent 60%),
                    radial-gradient(420px 220px at 0% 120%, rgba(56,189,248,.25), transparent 60%),
                    linear-gradient(135deg, #1e40af, #2563eb);
        animation: kgRein .6s cubic-bezier(.22,1,.36,1) backwards; }
    .kga-kopf::after { content: ""; position: absolute; right: -60px; top: -90px; width: 260px; height: 260px; border-radius: 50%; background: rgba(255,255,255,.08); pointer-events: none; }
    .kga-kopf > * { position: relative; z-index: 1; }
    .kga-titel { grid-column: 1; grid-row: 1; color: #fff !important; font-size: 28px !important; line-height: 1.15; letter-spacing: -.8px; font-weight: 900 !important; }
    .kga-titel::before { content: "Stundenzettel · KG-Agent"; display: block; margin-bottom: 6px; font-size: 11.5px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; color: #bfdbfe; }
    .kga-sub { grid-column: 1; grid-row: 2; color: #dbeafe !important; font-size: 13.5px !important; font-weight: 600; }
    .kga-zurueck { grid-column: 2; grid-row: 1 / span 2; justify-self: end; padding: 11px 16px; border-radius: 13px; background: #fff; color: #1d4ed8 !important; font-weight: 900 !important;
        box-shadow: 0 12px 24px -14px rgba(15,23,42,.6); transition: translate .2s, box-shadow .2s; white-space: nowrap; }
    .kga-zurueck:hover { translate: 0 -2px; box-shadow: 0 18px 30px -14px rgba(15,23,42,.65); }
    .kga-fehler { display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px !important; border-radius: 18px !important; border: 1px solid #fde68a;
        background: #fffbeb !important; color: #92400e !important; line-height: 1.5; box-shadow: 0 18px 40px -30px rgba(15,23,42,.45); animation: kgRein .6s cubic-bezier(.22,1,.36,1) backwards; animation-delay: 80ms; }
    .kga-fehler::before { content: "!"; flex: 0 0 30px; width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font-weight: 900; color: #fff;
        background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 10px 20px -10px rgba(217,119,6,.8); }
    /* Rahmen ohne Einblend-Bewegung: die Seite misst seine Position für die Höhe */
    #kgAgentFrame { border: 1px solid #e6ebf2 !important; border-radius: 24px !important; box-shadow: 0 18px 40px -30px rgba(15,23,42,.45) !important; }
    @keyframes kgRein { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @media (max-width: 640px) { .kga-kopf { grid-template-columns: 1fr; padding: 20px; } .kga-titel { font-size: 22px !important; }
        .kga-zurueck { grid-column: 1; grid-row: 3; justify-self: start; margin-top: 8px; } }
    @media (prefers-reduced-motion: reduce) { .kga-kopf, .kga-fehler { animation: none; } }
</style>

<div class="kga-kopf" style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px;">
    <a class="kga-zurueck" href="/stundenzettel/automatik" style="text-decoration:none;font-weight:700;color:#1d4ed8;">← Feste Zeiten &amp; Bestätigung</a>
    <span class="kga-titel" style="font-weight:800;font-size:18px;color:#0f172a;">📞 KG-Agent – Stundenzettel-Anruf</span>
    <span class="kga-sub" style="font-size:13px;color:#475569;">Eigenes Profil im Leon-Motor – der Verkaufs-Leon bleibt unverändert.</span>
</div>

{% if fehler %}
<div class="kga-fehler" style="padding:14px 16px;border-radius:12px;background:#fff7ed;color:#9a3412;font-weight:600;">{{ fehler }}</div>
{% else %}
<iframe
    id="kgAgentFrame"
    src="/leon-ui/agent?agent={{ profil }}"
    title="KG-Agent"
    style="display:block;width:100%;height:calc(100vh - 150px);min-height:600px;border:0;border-radius:20px;background:#f8fafc;box-shadow:0 10px 25px rgba(0,0,0,.05);"
></iframe>

<script>
    // Rahmenhöhe an das Fenster anpassen
    (function () {
        const frame = document.getElementById('kgAgentFrame');
        function fit() {
            const top = frame.getBoundingClientRect().top + window.scrollY;
            frame.style.height = Math.max(600, window.innerHeight - top - 24) + 'px';
        }
        window.addEventListener('resize', fit);
        fit();
    })();
</script>
{% endif %}

{% endblock %}
