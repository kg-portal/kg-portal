{% extends "base.html" %}
{% block content %}
<style>
    /* ===== PREMIUM V2 „Graphit“ ===== */
    .v2-kga-kopf {
        display: grid !important; grid-template-columns: minmax(0, 1fr) auto; column-gap: 16px; row-gap: 0 !important;
        align-items: end !important; padding: 6px 0 20px; margin-bottom: 20px !important; border-bottom: 1px solid #e5e7eb;
    }
    .v2-kga-kopf .v2-eyebrow { grid-column: 1; grid-row: 1; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; font-weight: 700; color: #6b7280; letter-spacing: .01em; }
    .v2-kga-kopf .v2-eyebrow i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: #7c3aed; }
    .v2-kga-titel { grid-column: 1; grid-row: 2; font-size: 30px !important; line-height: 1.15; font-weight: 800 !important; color: #111827 !important; letter-spacing: -.02em; }
    .v2-kga-unter { grid-column: 1; grid-row: 3; margin-top: 6px; font-size: 14px !important; font-weight: 500; color: #6b7280 !important; }
    .v2-kga-zurueck {
        grid-column: 2; grid-row: 1 / span 3; align-self: end; display: inline-flex; align-items: center; height: 38px; padding: 0 14px;
        border: 1px solid #d1d5db; border-radius: 10px; background: #fff; color: #111827 !important; font-size: 13.5px; white-space: nowrap;
        transition: background-color .15s ease, border-color .15s ease;
    }
    .v2-kga-zurueck:hover { background: #f9fafb; border-color: #9ca3af; }
    .v2-kga-fehler { border: 1px solid #fde68a; border-radius: 12px !important; background: #fffbeb !important; color: #92400e !important; font-size: 14px; }
    #kgAgentFrame.v2-kga-rahmen { border: 1px solid #e5e7eb !important; border-radius: 14px !important; background: #fff !important; box-shadow: 0 1px 2px rgba(16, 24, 40, .05) !important; }
    @media (max-width: 700px) {
        .v2-kga-kopf { grid-template-columns: minmax(0, 1fr); }
        .v2-kga-zurueck { grid-column: 1; grid-row: 4; justify-self: start; margin-top: 12px; }
        .v2-kga-titel { font-size: 24px !important; }
    }
</style>

<div class="v2-kga-kopf" style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px;">
    <a class="v2-kga-zurueck" href="/stundenzettel/automatik" style="text-decoration:none;font-weight:700;color:#1d4ed8;">← Feste Zeiten &amp; Bestätigung</a>
    <div class="v2-eyebrow"><i></i>Stundenzettel · KG-Agent</div>
    <span class="v2-kga-titel" style="font-weight:800;font-size:18px;color:#0f172a;">📞 KG-Agent – Stundenzettel-Anruf</span>
    <span class="v2-kga-unter" style="font-size:13px;color:#475569;">Eigenes Profil im Leon-Motor – der Verkaufs-Leon bleibt unverändert.</span>
</div>

{% if fehler %}
<div class="v2-kga-fehler" style="padding:14px 16px;border-radius:12px;background:#fff7ed;color:#9a3412;font-weight:600;">{{ fehler }}</div>
{% else %}
<iframe
    class="v2-kga-rahmen"
    id="kgAgentFrame"
    src="/leon-ui/agent?agent={{ profil }}"
    title="KG-Agent"
    style="display:block;width:100%;height:calc(100vh - 150px);min-height:600px;border:0;border-radius:20px;background:#f8fafc;box-shadow:0 10px 25px rgba(0,0,0,.05);"
></iframe>

<script>
    // Rahmenhöhe an das Fenster anpassen
    (function () {
        const frame = document.getElementById('kgAgentFrame');
        function fit() {
            const top = frame.getBoundingClientRect().top + window.scrollY;
            frame.style.height = Math.max(600, window.innerHeight - top - 24) + 'px';
        }
        window.addEventListener('resize', fit);
        fit();
    })();
</script>
{% endif %}

{% endblock %}
