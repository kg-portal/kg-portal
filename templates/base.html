<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KG Portal V2</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --kg-bg:#f8fafc;
            --kg-sidebar:#ffffff;
            --kg-accent:#2563eb;
            --kg-border:#e2e8f0;
            --kg-text:#1e293b;
            --kg-muted:#64748b;
            --kg-hover:#eef2ff;
            --kg-sidebar-width:280px;
        }

        html,
        body {
            margin:0 !important;
            padding:0 !important;
            min-height:100vh !important;
            background:var(--kg-bg) !important;
            font-family:Arial, Helvetica, sans-serif !important;
            color:var(--kg-text) !important;
            overflow-x:hidden !important;
        }

        .kg-portal-body,
        .kg-portal-body *:not(i):not(.fa):not(.fa-solid):not(.fa-regular):not(.fa-brands),
        .kg-portal-body button,
        .kg-portal-body input,
        .kg-portal-body select,
        .kg-portal-body textarea {
            font-family:Arial, Helvetica, sans-serif !important;
        }

        *,
        *::before,
        *::after {
            box-sizing:border-box;
        }

        body.kg-portal-body {
            background:var(--kg-bg) !important;
        }

        .kg-portal-shell {
            width:100%;
            min-height:100vh;
            background:var(--kg-bg);
        }

        .portal-sidebar {
            position:fixed;
            left:0;
            top:0;
            width:var(--kg-sidebar-width);
            height:100vh;
            background:var(--kg-sidebar);
            border-right:1px solid var(--kg-border);
            padding:58px 20px 30px 20px;
            display:flex;
            flex-direction:column;
            overflow-y:auto;
            overflow-x:hidden;
            z-index:9999;
        }

        .portal-sidebar-title {
            position:relative;
            overflow:hidden;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            text-decoration:none;
            cursor:pointer;
            text-align:center;
            margin:0 0 40px 0;
            min-height:106px;
            padding:22px 18px 20px 18px;
            border-radius:20px;
            background:linear-gradient(135deg, #071a44 0%, #123a8f 44%, #2563eb 100%);
            border:1px solid rgba(255,255,255,0.34);
            box-shadow:0 16px 30px rgba(15,47,131,0.20), inset 0 1px 0 rgba(255,255,255,0.24);
            color:#ffffff;
            isolation:isolate;
        }

        .portal-sidebar-title::before {
            content:"";
            position:absolute;
            top:-70%;
            left:-45%;
            width:58%;
            height:240%;
            background:linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.08) 35%, rgba(255,255,255,0.38) 50%, rgba(255,255,255,0.08) 65%, transparent 100%);
            transform:rotate(18deg);
            pointer-events:none;
            z-index:1;
        }

        .portal-sidebar-title::after {
            content:"";
            position:absolute;
            left:36px;
            right:36px;
            bottom:17px;
            height:2px;
            border-radius:999px;
            background:linear-gradient(90deg, transparent, rgba(255,255,255,0.88), rgba(147,197,253,0.95), transparent);
            box-shadow:0 0 14px rgba(147,197,253,0.65);
            pointer-events:none;
            z-index:2;
        }

        .portal-logo-mark {
            width:48px;
            height:48px;
            border-radius:16px;
            display:flex;
            align-items:center;
            justify-content:center;
            flex-shrink:0;
            font-size:19px;
            line-height:1;
            font-weight:900;
            letter-spacing:-1px;
            color:#ffffff;
            background:linear-gradient(135deg, #0f2f83 0%, #1d4ed8 55%, #60a5fa 100%);
            box-shadow:0 12px 22px rgba(37,99,235,0.28), inset 0 1px 0 rgba(255,255,255,0.28);
        }

        .portal-title-wrap {
            display:flex;
            flex-direction:column;
            min-width:0;
        }

        .portal-title-main {
            position:relative;
            z-index:3;
            display:block;
            font-size:30px;
            line-height:0.95;
            font-weight:900;
            letter-spacing:-1.2px;
            color:#ffffff;
            white-space:nowrap;
        }

        .portal-title-sub {
            position:relative;
            z-index:3;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            margin-top:10px;
            padding:0;
            border-radius:0;
            font-family:"Trebuchet MS", Arial, sans-serif;
            font-size:11px;
            line-height:1;
            font-weight:700;
            letter-spacing:4px;
            text-transform:uppercase;
            color:#ffffff;
            background:transparent;
            border:none;
            box-shadow:none;
            text-shadow:0 2px 8px rgba(0,0,0,0.28);
            white-space:nowrap;
        }

        .portal-nav-list {
            
        }

        .portal-nav-section-title {
            font-size:11px;
            font-weight:700;
            letter-spacing:1.5px;
            color:var(--kg-muted);
            margin:0 0 3px 6px;
            text-transform:uppercase;
        }

        .portal-nav-group-title {
            color:#000000;
            font-size:11px;
            font-weight:900;
            letter-spacing:1.5px;
            text-transform:uppercase;
            margin:0 0 12px 6px;
            line-height:1;
            user-select:none;
            flex-shrink:0;
        }

        .portal-nav-list {
            display:flex;
            flex-direction:column;
            width:100%;
        }

        .portal-nav-item {
            
        }

        .portal-nav-item[data-nav-key="startseite"] {
            margin-bottom:26px;
        }

        .portal-nav-item[data-nav-key="todo"] {
            margin-bottom:36px;
        }

        .portal-nav-item[data-nav-key="vertrag"] {
            margin-bottom:36px;
        }

        .portal-nav-item[data-nav-key="kunden"] {
            margin-bottom:36px;
        }

        .portal-nav-item[data-nav-key="vertretung"] {
            margin-bottom:36px;
        }

        .portal-nav-item {
            position:relative;
            overflow:hidden;
            padding:16px 14px 16px 20px;
            border-radius:14px;
            color:#ffffff;
            cursor:pointer;
            font-weight:800;
            font-size:15px;
            margin-bottom:10px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            text-decoration:none;
            transition:0.2s ease;
            flex-shrink:0;
            user-select:none;
            background:#ffffff;
            border:1px solid #e2e8f0;
            box-shadow:0 6px 16px rgba(15,23,42,0.08);
        }

        .portal-nav-content {
            display:flex;
            align-items:center;
            gap:15px;
            min-width:0;
        }

        .portal-drag-handle {
            width:auto !important;
            font-size:15px !important;
            color:#3b82f6 !important;
            cursor:grab;
            opacity:0.9;
            margin-left:auto;
            position:relative;
            z-index:2;
        }

        .portal-drag-handle:active {
            cursor:grabbing;
        }

        .portal-nav-item:hover .portal-drag-handle {
            opacity:1;
        }

        .portal-nav-item.active .portal-drag-handle {
            color:#fff !important;
            opacity:0.9;
        }

        .portal-nav-ghost {
            opacity:0.45;
            background:#dbeafe !important;
        }

        .portal-nav-chosen {
            box-shadow:none;
        }

        .portal-nav-item i {
            font-size:20px;
            width:25px;
            text-align:center;
            flex-shrink:0;
        }

        .portal-nav-item::before {
            content:"";
            position:absolute;
            top:-70%;
            left:-50%;
            width:58%;
            height:240%;
            background:linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.08) 35%, rgba(255,255,255,0.38) 50%, rgba(255,255,255,0.08) 65%, transparent 100%);
            transform:rotate(18deg);
            pointer-events:none;
        }

        .portal-nav-item::after {
            display:none;
        }

        .portal-nav-item:hover {
            background:#f8fafc;
            box-shadow:0 8px 18px rgba(15,23,42,0.10);
            transform:translateY(-1px);
        }

        .portal-nav-item.active {
            background:#ffffff;
            color:#123a8f;
            border:2px solid #1d4ed8;
            box-shadow:inset 0 1px 0 rgba(255,255,255,0.95);
        }

        .portal-nav-item.active::after {
            display:none;
        }

        .portal-nav-item.active .portal-nav-content {
            color:#123a8f !important;
        }

        .portal-nav-item.active i {
            color:#1d4ed8 !important;
        }

        .portal-nav-item.active .portal-drag-handle {
            color:#1d4ed8 !important;
        }

        .portal-nav-item .portal-nav-content,
        .portal-nav-item .portal-drag-handle {
            position:relative;
            z-index:2;
        }

        .portal-nav-item .portal-nav-content {
            color:#123a8f;
            text-shadow:none;
            font-weight:900;
            letter-spacing:0.1px;
        }

        .portal-nav-item i {
            filter:none;
        }

        .icon-blue { color:#3b82f6 !important; }
        .icon-orange { color:#f59e0b !important; }
        .icon-purple { color:#8b5cf6 !important; }
        .icon-green { color:#10b981 !important; }
        .icon-cyan { color:#06b6d4 !important; }
        .icon-indigo { color:#6366f1 !important; }
        .icon-teal { color:#14b8a6 !important; }
        .icon-red { color:#ef4444 !important; }
        .icon-pink { color:#ec4899 !important; }

        .portal-main {
            width:calc(100% - var(--kg-sidebar-width));
            min-height:100vh;
            margin-left:var(--kg-sidebar-width);
            padding:30px;
            background:var(--kg-bg);
            overflow:visible;
        }

        .portal-card {
            width:100%;
            min-height:calc(100vh - 60px);
            background:#fff;
            border:1px solid var(--kg-border);
            border-radius:24px;
            padding:30px;
            overflow:visible;
        }

        /* =====================================================
           TABLET / MOBILE - ÜSTTE YATAY PORTAL MENÜ
           Menü kaybolmaz, sadece kompakt üst bar olur
           ===================================================== */
        @media (max-width:1024px) {
            .portal-sidebar {
                position:sticky !important;
                top:0 !important;
                left:auto !important;
                width:100% !important;
                height:auto !important;
                max-height:none !important;
                border-right:none !important;
                border-bottom:1px solid var(--kg-border) !important;
                padding:10px !important;
                z-index:9999 !important;
                overflow:visible !important;
                background:#ffffff !important;
            }

            .portal-sidebar-title {
                min-height:54px !important;
                height:54px !important;
                margin:0 0 10px 0 !important;
                padding:10px 14px !important;
                border-radius:16px !important;
            }

            .portal-title-main {
                font-size:20px !important;
                line-height:1 !important;
            }

            .portal-title-sub {
                font-size:8px !important;
                margin-top:5px !important;
                padding:4px 10px !important;
                letter-spacing:2px !important;
            }

            .portal-sidebar-title::after {
                display:none !important;
            }

            .portal-nav-list {
                display:flex !important;
                flex-direction:row !important;
                gap:8px !important;
                overflow-x:auto !important;
                overflow-y:hidden !important;
                width:100% !important;
                padding:0 2px 4px 2px !important;
                scroll-snap-type:x proximity !important;
                -webkit-overflow-scrolling:touch !important;
            }

            .portal-nav-list::-webkit-scrollbar {
                height:4px !important;
            }

            .portal-nav-list::-webkit-scrollbar-thumb {
                background:#cbd5e1 !important;
                border-radius:999px !important;
            }

            .portal-nav-group-title {
                display:none !important;
            }

            .portal-nav-item,
            .portal-nav-item[data-nav-key="startseite"],
            .portal-nav-item[data-nav-key="todo"],
            .portal-nav-item[data-nav-key="vertrag"],
            .portal-nav-item[data-nav-key="kunden"],
            .portal-nav-item[data-nav-key="vertretung"] {
                flex:0 0 auto !important;
                min-width:132px !important;
                height:46px !important;
                margin:0 !important;
                padding:10px 12px !important;
                border-radius:13px !important;
                font-size:13px !important;
                scroll-snap-align:start !important;
            }

            .portal-nav-content {
                gap:9px !important;
                white-space:nowrap !important;
            }

            .portal-nav-item i {
                font-size:15px !important;
                width:18px !important;
            }

            .portal-drag-handle {
                display:none !important;
            }

            .portal-main {
                width:100% !important;
                margin-left:0 !important;
                min-height:auto !important;
                padding:10px !important;
            }

            .portal-card {
                width:100% !important;
                min-height:calc(100vh - 150px) !important;
                border-radius:18px !important;
                padding:10px !important;
                overflow:hidden !important;
            }
        }

        @media (max-width:760px) {
            .portal-sidebar {
                padding:8px !important;
            }

            .portal-sidebar-title {
                height:48px !important;
                min-height:48px !important;
                margin-bottom:8px !important;
            }

            .portal-title-main {
                font-size:18px !important;
            }

            .portal-nav-item,
            .portal-nav-item[data-nav-key="startseite"],
            .portal-nav-item[data-nav-key="todo"],
            .portal-nav-item[data-nav-key="vertrag"],
            .portal-nav-item[data-nav-key="kunden"],
            .portal-nav-item[data-nav-key="vertretung"] {
                min-width:118px !important;
                height:42px !important;
                padding:9px 10px !important;
                font-size:12px !important;
            }

            .portal-nav-item i {
                font-size:14px !important;
                width:16px !important;
            }

            .portal-main {
                padding:6px !important;
            }

            .portal-card {
                min-height:calc(100vh - 120px) !important;
                border-radius:14px !important;
                padding:6px !important;
            }
        }

        /* =====================================================
           TABLET YAN EKRAN - ÜSTTE YATAY PORTAL MENÜ
           Tablet yatayda da sol menüye dönmesin
           ===================================================== */
        @media (hover:none) and (pointer:coarse) and (min-width:761px) and (max-width:1366px) {
            .portal-sidebar {
                position:sticky !important;
                top:0 !important;
                left:auto !important;
                width:100% !important;
                height:auto !important;
                max-height:none !important;
                border-right:none !important;
                border-bottom:1px solid var(--kg-border) !important;
                padding:10px !important;
                z-index:9999 !important;
                overflow:visible !important;
                background:#ffffff !important;
            }

            .portal-sidebar-title {
                min-height:54px !important;
                height:54px !important;
                margin:0 0 10px 0 !important;
                padding:10px 14px !important;
                border-radius:16px !important;
            }

            .portal-title-main {
                font-size:20px !important;
                line-height:1 !important;
            }

            .portal-title-sub {
                font-size:8px !important;
                margin-top:5px !important;
                padding:4px 10px !important;
                letter-spacing:2px !important;
            }

            .portal-sidebar-title::after {
                display:none !important;
            }

            .portal-nav-list {
                display:flex !important;
                flex-direction:row !important;
                gap:8px !important;
                overflow-x:auto !important;
                overflow-y:hidden !important;
                width:100% !important;
                padding:0 2px 4px 2px !important;
                scroll-snap-type:x proximity !important;
                -webkit-overflow-scrolling:touch !important;
            }

            .portal-nav-list::-webkit-scrollbar {
                height:4px !important;
            }

            .portal-nav-list::-webkit-scrollbar-thumb {
                background:#cbd5e1 !important;
                border-radius:999px !important;
            }

            .portal-nav-group-title {
                display:none !important;
            }

            .portal-nav-item,
            .portal-nav-item[data-nav-key="startseite"],
            .portal-nav-item[data-nav-key="todo"],
            .portal-nav-item[data-nav-key="vertrag"],
            .portal-nav-item[data-nav-key="kunden"],
            .portal-nav-item[data-nav-key="vertretung"] {
                flex:0 0 auto !important;
                min-width:132px !important;
                height:46px !important;
                margin:0 !important;
                padding:10px 12px !important;
                border-radius:13px !important;
                font-size:13px !important;
                scroll-snap-align:start !important;
            }

            .portal-nav-content {
                gap:9px !important;
                white-space:nowrap !important;
            }

            .portal-nav-item i {
                font-size:15px !important;
                width:18px !important;
            }

            .portal-drag-handle {
                display:none !important;
            }

            .portal-main {
                width:100% !important;
                margin-left:0 !important;
                min-height:auto !important;
                padding:10px !important;
            }

            .portal-card {
                width:100% !important;
                min-height:calc(100vh - 150px) !important;
                border-radius:18px !important;
                padding:10px !important;
                overflow:hidden !important;
            }
        }

        /* =====================================================
           TABLET YAN EKRAN - STEUERZENTRALE ÜST ALAN DÜZELTME
           Hava durumu sağa taşmasın
           ===================================================== */
        @media (hover:none) and (pointer:coarse) and (min-width:761px) and (max-width:1366px) and (orientation:landscape) {
            .portal-card {
                overflow:hidden !important;
            }

            .portal-card > * {
                max-width:100% !important;
            }

            .portal-card .kg-hero,
            .portal-card .dashboard-hero,
            .portal-card .dashboard-header,
            .portal-card .steuerzentrale-header,
            .portal-card .kg-dashboard-header,
            .portal-card .top-header,
            .portal-card .page-header,
            .portal-card .hero-header {
                width:100% !important;
                max-width:100% !important;
                display:grid !important;
                grid-template-columns:minmax(0, 1fr) minmax(190px, 260px) !important;
                align-items:stretch !important;
                gap:10px !important;
                overflow:hidden !important;
            }

            .portal-card .kg-hero > *,
            .portal-card .dashboard-hero > *,
            .portal-card .dashboard-header > *,
            .portal-card .steuerzentrale-header > *,
            .portal-card .kg-dashboard-header > *,
            .portal-card .top-header > *,
            .portal-card .page-header > *,
            .portal-card .hero-header > * {
                min-width:0 !important;
                max-width:100% !important;
            }

            .portal-card .weather,
            .portal-card .weather-box,
            .portal-card .weather-card,
            .portal-card .weather-widget,
            .portal-card .wetter,
            .portal-card .wetter-box,
            .portal-card .wetter-card,
            .portal-card .wetter-widget {
                width:100% !important;
                max-width:260px !important;
                min-width:0 !important;
                margin-left:0 !important;
                overflow:hidden !important;
            }
        }

            .portal-card > * {
                max-width:100% !important;
            }

            .portal-card .kg-hero,
            .portal-card .dashboard-hero,
            .portal-card .dashboard-header,
            .portal-card .steuerzentrale-header,
            .portal-card .kg-dashboard-header,
            .portal-card .top-header,
            .portal-card .page-header,
            .portal-card .hero-header {
                width:100% !important;
                max-width:100% !important;
                display:flex !important;
                align-items:stretch !important;
                justify-content:space-between !important;
                gap:12px !important;
                overflow:hidden !important;
            }

            .portal-card .kg-hero > *,
            .portal-card .dashboard-hero > *,
            .portal-card .dashboard-header > *,
            .portal-card .steuerzentrale-header > *,
            .portal-card .kg-dashboard-header > *,
            .portal-card .top-header > *,
            .portal-card .page-header > *,
            .portal-card .hero-header > * {
                min-width:0 !important;
            }

            .portal-card .weather,
            .portal-card .weather-box,
            .portal-card .weather-card,
            .portal-card .weather-widget,
            .portal-card .wetter,
            .portal-card .wetter-box,
            .portal-card .wetter-card,
            .portal-card .wetter-widget {
                flex:0 1 260px !important;
                max-width:260px !important;
                min-width:210px !important;
                margin-left:auto !important;
                overflow:hidden !important;
            }
        }
    </style>
</head>
<body class="kg-portal-body">
<div class="kg-portal-shell">

    <aside class="portal-sidebar">
        <a class="portal-sidebar-title" href="/"><span class="portal-title-main">KG CRM</span><span class="portal-title-sub">PORTAL</span></a>

        <nav id="portalNavSortable" class="portal-nav-list">
            <a class="portal-nav-item {% if request.path == '/' %}active{% endif %}" href="/" data-nav-key="startseite">
                <span class="portal-nav-content"><i class="fa-solid fa-chart-line icon-blue"></i> Startseite</span>
                <i class="fa-solid fa-grip-vertical portal-drag-handle"></i>
            </a>

            <div class="portal-nav-group-title" id="planungTitle">Planung</div>

                        <a class="portal-nav-item {% if request.path == '/kalender' %}active{% endif %}" href="/kalender" data-nav-key="kalender">
                <span class="portal-nav-content"><i class="fa-solid fa-calendar-day icon-orange"></i> Kalender</span>
                <i class="fa-solid fa-grip-vertical portal-drag-handle"></i>
            </a>

            <a class="portal-nav-item {% if request.path.startswith('/gmail') %}active{% endif %}" href="/gmail" data-nav-key="gmail">
                <span class="portal-nav-content"><i class="fa-solid fa-envelope icon-blue"></i> KG-Mail</span>
                <i class="fa-solid fa-grip-vertical portal-drag-handle"></i>
            </a>

            <a class="portal-nav-item {% if request.path.startswith('/todo') %}active{% endif %}" href="/todo" data-nav-key="todo">
                <span class="portal-nav-content"><i class="fa-solid fa-clipboard-list icon-pink"></i> To Do Liste</span>
                <i class="fa-solid fa-grip-vertical portal-drag-handle"></i>
            </a>

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/static/sw.js');
  Notification.requestPermission();

<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const nav = document.getElementById('portalNavSortable');
    if (!nav) return;

    const storageKey = 'kgPortalNavOrder';
    localStorage.removeItem(storageKey);

    const fixedOrder = [
        'startseite',
        'kalender',
        'gmail',
        'todo',
        'kg-ai',
        'whatsapp-inbox',
        'datenbank',
        'besichtigung',
        'angebot',
        'leistungsverzeichnis',
        'vertrag',
        'kunden',
        'mitarbeiter',
        'stundenzettel',
        'vertretung',
        'buchhaltung'
    ];

    fixedOrder.forEach(function (key) {
        const item = nav.querySelector('[data-nav-key="' + key + '"]');
        if (item) nav.appendChild(item);
    });

    const planungTitle = document.getElementById('planungTitle');
    const kalenderItem = nav.querySelector('[data-nav-key="kalender"]');
    if (planungTitle && kalenderItem) {
        nav.insertBefore(planungTitle, kalenderItem);
    }

    const kundengewinnungTitle = document.getElementById('kundengewinnungTitle');
    const datenbankItem = nav.querySelector('[data-nav-key="datenbank"]');
    if (kundengewinnungTitle && datenbankItem) {
        nav.insertBefore(kundengewinnungTitle, datenbankItem);
    }

    const kundenverwaltungTitle = document.getElementById('kundenverwaltungTitle');
    const kundenItem = nav.querySelector('[data-nav-key="kunden"]');
    if (kundenverwaltungTitle && kundenItem) {
        nav.insertBefore(kundenverwaltungTitle, kundenItem);
    }

    const personalTitle = document.getElementById('personalTitle');
    const mitarbeiterItem = nav.querySelector('[data-nav-key="mitarbeiter"]');
    if (personalTitle && mitarbeiterItem) {
        nav.insertBefore(personalTitle, mitarbeiterItem);
    }

    const finanzenTitle = document.getElementById('finanzenTitle');
    const buchhaltungItem = nav.querySelector('[data-nav-key="buchhaltung"]');
    if (finanzenTitle && buchhaltungItem) {
        nav.insertBefore(finanzenTitle, buchhaltungItem);
    }

    const currentPath = window.location.pathname || '/';
    const navItems = Array.from(nav.querySelectorAll('.portal-nav-item'));
    navItems.forEach(function (item) {
        const href = item.getAttribute('href') || '';
        const isHome = currentPath === '/' && href === '/';
        const isSubPage = href !== '/' && currentPath.startsWith(href);
        item.classList.toggle('active', isHome || isSubPage);
    });

    if (!nav.querySelector('.portal-nav-item.active') && navItems.length) {
        navItems[0].classList.add('active');
    }
});
</script>
