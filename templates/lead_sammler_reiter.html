{% extends "base.html" %}
{% block content %}
<style>
    /* Gleiche Übersicht wie in KG Business unter Datenbank → Lead-Sammler */
    .ls-rahmen { display: flex; flex-direction: column; gap: 10px; padding: 4px 0; }
    .ls-zeile { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .ls-zeile p { margin: 0; font-size: 13px; font-weight: 700; color: #64748b; }
    .ls-zeile a { font-size: 13px; font-weight: 800; color: #0f766e; text-decoration: none; white-space: nowrap; }
    .ls-rahmen iframe { width: 100%; height: calc(100vh - 120px); min-height: 640px; border: 1px solid #dbe3ef; border-radius: 18px; background: #f4f7f5; }
    /* ===== PREMIUM (einheitliches Design) ===== */
    .ls-rahmen { gap: 16px; padding: 0; }
    .ls-zeile { position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 18px;
        padding: 24px 28px; border-radius: 24px; box-shadow: 0 24px 50px -28px rgba(29,78,216,.7);
        background: radial-gradient(520px 230px at 90% -20%, rgba(255,255,255,.26), transparent 60%),
                    radial-gradient(420px 220px at 0% 120%, rgba(56,189,248,.25), transparent 60%),
                    linear-gradient(135deg, #1e40af, #2563eb); }
    .ls-zeile::before { content: "Kundengewinnung · KG Business"; grid-column: 1 / -1; margin-bottom: 4px;
        font-size: 11.5px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; color: #bfdbfe; }
    .ls-zeile::after { content: ""; position: absolute; right: -60px; top: -90px; width: 260px; height: 260px; border-radius: 50%; background: rgba(255,255,255,.08); pointer-events: none; }
    .ls-zeile p { position: relative; z-index: 1; color: #dbeafe; font-weight: 600; font-size: 13.5px; line-height: 1.5; max-width: 820px; }
    .ls-zeile p::before { content: "Lead-Sammler"; display: block; margin-bottom: 4px; font-size: 30px; line-height: 1.15; font-weight: 900; letter-spacing: -1px; color: #fff; }
    .ls-zeile a { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 8px; padding: 11px 16px; border-radius: 13px; background: #fff; color: #1d4ed8;
        font-weight: 900; box-shadow: 0 12px 24px -14px rgba(15,23,42,.6); transition: translate .2s, box-shadow .2s; }
    .ls-zeile a:hover { translate: 0 -2px; box-shadow: 0 18px 30px -14px rgba(15,23,42,.65); }
    .ls-rahmen iframe { height: calc(100vh - 200px); border: 1px solid #e6ebf2; border-radius: 24px; background: #f8fbff; box-shadow: 0 18px 40px -30px rgba(15,23,42,.45); }
    .ls-zeile, .ls-rahmen iframe { animation: kgRein .6s cubic-bezier(.22,1,.36,1) backwards; }
    .ls-rahmen iframe { animation-delay: 90ms; }
    @keyframes kgRein { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @media (max-width: 640px) { .ls-zeile { grid-template-columns: 1fr; row-gap: 12px; padding: 20px; } .ls-zeile p::before { font-size: 24px; } .ls-zeile a { justify-self: start; } }
    @media (prefers-reduced-motion: reduce) { .ls-zeile, .ls-rahmen iframe { animation: none; } }
</style>
<div class="ls-rahmen">
    <div class="ls-zeile">
        <p>Läuft auf dem Server von KG Business (9–18 Uhr). Beim ersten Öffnen ggf. einmal mit dem KG-Business-Zugang anmelden.</p>
        <a href="{{ lead_sammler_url }}" target="_blank" rel="noopener"><i class="fa-solid fa-up-right-from-square"></i> In eigenem Fenster öffnen</a>
    </div>
    <iframe src="{{ lead_sammler_url }}" title="Lead-Sammler"></iframe>
</div>
{% endblock %}
