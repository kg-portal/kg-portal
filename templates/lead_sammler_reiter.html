{% extends "base.html" %}
{% block content %}
<style>
    /* Gleiche Übersicht wie in KG Business unter Datenbank → Lead-Sammler */
    .ls-rahmen { display: flex; flex-direction: column; gap: 10px; padding: 4px 0; }
    .ls-zeile { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .ls-zeile p { margin: 0; font-size: 13px; font-weight: 700; color: #64748b; }
    .ls-zeile a { font-size: 13px; font-weight: 800; color: #0f766e; text-decoration: none; white-space: nowrap; }
    .ls-rahmen iframe { width: 100%; height: calc(100vh - 120px); min-height: 640px; border: 1px solid #dbe3ef; border-radius: 18px; background: #f4f7f5; }

    /* ===== PREMIUM V2 „Graphit“ ===== */
    .ls-rahmen { gap: 0; padding: 0; }
    .ls-rahmen .v2-eyebrow { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; font-weight: 700; color: #6b7280; letter-spacing: .01em; }
    .ls-rahmen .v2-eyebrow i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: #0d9488; }
    .ls-rahmen .v2-ls-titel { margin: 0; font-size: 30px; line-height: 1.15; font-weight: 800; color: #111827; letter-spacing: -.02em; }
    .ls-rahmen .v2-ls-kopf { padding-top: 6px; }
    .ls-zeile { align-items: flex-end; padding: 6px 0 20px; margin-bottom: 20px; border-bottom: 1px solid #e5e7eb; }
    .ls-zeile p { font-size: 14px; font-weight: 500; color: #6b7280; line-height: 1.6; }
    .ls-zeile a {
        display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 10px;
        border: 1px solid #d1d5db; background: #fff; color: #111827; font-size: 13.5px; font-weight: 700;
        transition: background-color .15s ease, border-color .15s ease;
    }
    .ls-zeile a:hover { background: #f9fafb; border-color: #9ca3af; }
    .ls-zeile a i { color: #0d9488; font-size: 12px; }
    .ls-rahmen iframe { border: 1px solid #e5e7eb; border-radius: 14px; background: #fff; box-shadow: 0 1px 2px rgba(16, 24, 40, .05); }
</style>
<div class="ls-rahmen">
    <div class="v2-ls-kopf"><div class="v2-eyebrow"><i></i>Kundengewinnung · KG Business</div><h1 class="v2-ls-titel">Lead-Sammler</h1></div>
    <div class="ls-zeile">
        <p>Läuft auf dem Server von KG Business (9–18 Uhr). Beim ersten Öffnen ggf. einmal mit dem KG-Business-Zugang anmelden.</p>
        <a href="{{ lead_sammler_url }}" target="_blank" rel="noopener"><i class="fa-solid fa-up-right-from-square"></i> In eigenem Fenster öffnen</a>
    </div>
    <iframe src="{{ lead_sammler_url }}" title="Lead-Sammler"></iframe>
</div>
{% endblock %}
