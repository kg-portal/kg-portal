          <div class="gc-detail-row"><div class="gc-detail-icon"><i class="fa-solid fa-briefcase"></i></div><div style="display:grid;grid-template-columns:128px 220px;gap:8px"><select class="gc-detail-control" id="gcAvailability"><option value="free">Verfügbar</option><option value="busy">Beschäftigt</option></select><select class="gc-detail-control" id="gcVisibility"><option value="default">Standardsichtbarkeit</option><option value="public">Öffentlich</option><option value="private">Privat</option></select></div></div>
          <div class="gc-detail-row"><div class="gc-detail-icon"><i class="fa-solid fa-align-left"></i></div><div class="gc-detail-control" style="padding:0"><div class="gc-formatbar"><i class="fa-brands fa-google-drive"></i><b>B</b><i>I</i><u>U</u><span>☷</span><span>☰</span><i class="fa-solid fa-link"></i><span>Tx</span></div><textarea class="gc-detail-control gc-description" id="gcDescription" placeholder="Beschreibung hinzufügen"></textarea></div></div>
        </div>
      </section>

      <aside class="gc-editor-right">
        <div class="gc-right-tabs"><button class="gc-right-tab">Gäste</button></div>
        <input class="gc-guests" id="gcGuests" placeholder="Gäste hinzufügen">
        <div class="gc-right-title">Berechtigungen für Gäste</div>
        <label class="gc-guest-check"><input type="checkbox"><span>Termin bearbeiten</span></label>
        <label class="gc-guest-check"><input type="checkbox" checked><span>Gäste einladen</span></label>
        <label class="gc-guest-check"><input type="checkbox" checked><span>Gästeliste anzeigen</span></label>
      </aside>
    </div>
    <div class="gc-actions"><button class="gc-cancel">Abbrechen</button></div>
  </div>
</div>

<div id="kgBesichtigungTimeModal" style="display:none;position:fixed;inset:0;z-index:30000;background:rgba(15,23,42,.38);align-items:center;justify-content:center;">
    <div style="width:340px;background:#ffffff;border-radius:24px;padding:24px;box-shadow:0 24px 70px rgba(15,23,42,.28);">
        <div style="font-size:20px;font-weight:700;color:#202124;margin-bottom:6px;">Uhrzeit auswählen</div>
        <div id="kgBesichtigungFirmaText" style="font-size:13px;color:#5f6368;margin-bottom:18px;"></div>

        <input
            id="kgBesichtigungTimeInput"
            type="time"
            value="09:00"
            style="width:100%;height:52px;border:1px solid #dadce0;border-radius:14px;padding:0 16px;font-size:22px;outline:none;background:#f8fafd;"
        >

        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:22px;">
            <button
                type="button"
                id="kgBesichtigungTimeCancel"
                style="height:42px;padding:0 18px;border:0;border-radius:21px;background:#eef1f5;color:#3c4043;font-weight:700;cursor:pointer;"
            >
                Abbrechen
            </button>

            <button
                type="button"
                id="kgBesichtigungTimeSave"
                style="height:42px;padding:0 20px;border:0;border-radius:21px;background:#0b57d0;color:#ffffff;font-weight:700;cursor:pointer;"
            >
                Speichern
            </button>
        </div>
    </div>
</div>

<script>

(() => {
    const API_EVENTS_URL = "/api/google-calendar/events";
    const locale = "de-DE";
    const today = new Date();
    let currentDate = new Date(today.getFullYear(), today.getMonth(), 1);
    let miniDate = new Date(currentDate);
    let miniSelectedDate = null;
    let gcEvents = [];
    let editingEventId = null;
    let editingCalendarId = null;

    const pageParams = new URLSearchParams(window.location.search);
    const pageSource = pageParams.get("source") || "";
    const pageFirma = pageParams.get("firma") || "";

    const fallbackEvents = [];

    function pad(n){ return String(n).padStart(2,"0"); }
    function localDateKey(date){ return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`; }
    function monthStart(date){ return new Date(date.getFullYear(),date.getMonth(),1,0,0,0); }
    function monthEnd(date){ return new Date(date.getFullYear(),date.getMonth()+1,1,0,0,0); }
    function showStatus(text){ const el=document.getElementById("gcStatus"); el.textContent=text; el.style.display="block"; setTimeout(()=>el.style.display="none",3500); }
    function normalizeColor(value){ const allowed=["blue","orange","green","pink","yellow","purple","red"]; return allowed.includes(value)?value:"blue"; }

async function loadEvents(){
    const start = monthStart(currentDate).toISOString();
    const end = monthEnd(currentDate).toISOString();
    const cacheKey = `kg-calendar-events-${start.slice(0,7)}`;

    try{
        const cachedEvents = localStorage.getItem(cacheKey);

        if(cachedEvents){
            gcEvents = JSON.parse(cachedEvents);
            buildCalendar();
        }
    }catch(cacheError){
        console.log("Kalender Cache konnte nicht gelesen werden:", cacheError);
    }

    try{

            const response = await fetch(`${API_EVENTS_URL}?timeMin=${encodeURIComponent(start)}&timeMax=${encodeURIComponent(end)}`,{headers:{"Accept":"application/json"}});
            const data = await response.json();
            if(!response.ok || data.success === false) throw new Error(data.error || `HTTP ${response.status}`);
            const source = Array.isArray(data)?data:(data.events||data.items||[]);
            const CALENDAR_COLORS = {
                "Kalender": "blue",
                "Bayram": "pink",
                "Besichtigungstermine": "orange",
                "Fensterreinigung": "green",
                "Geburtstage": "yellow",
                "Telefonakquise": "purple",
                "Feiertage in Deutschland": "red"
            };

            gcEvents = source.map(item => {
                const calendarName =
                    item.calendar_name ||
                    item.calendarName ||
                    item.organizer?.displayName ||
                    "";

                const eventColor = normalizeColor(
                    item.color ||
                    item.color_name ||
                    item.calendar_color ||
                    CALENDAR_COLORS[calendarName]
                );

                return {
                    id: item.id,
                    title: item.title || item.summary || "Ohne Titel",
                    start: item.start?.dateTime || item.start?.date || item.start,
                    end: item.end?.dateTime || item.end?.date || item.end || null,
                    color: eventColor,
                    calendarId: item.calendarId || item.calendar_id || null,
                    calendarName: calendarName,
                    location: item.location || "",
                    description: item.description || ""
                };
    
}).filter(item => item.id && item.start);

try{
    localStorage.setItem(cacheKey, JSON.stringify(gcEvents));
}catch(cacheError){
    console.log("Kalender Cache konnte nicht gespeichert werden:", cacheError);
}
        }catch(error){
            gcEvents = [];
            showStatus(`Google Kalender yüklenemedi: ${error.message}`);
        }
        buildCalendar();
    }

    async function updateEventDate(eventId, newDateKey) {
        const ev = gcEvents.find(e => e.id === eventId);
        if(!ev) return;

        const oldStart = String(ev.start);
        const oldEnd = String(ev.end || "");
        const isAllDay = !oldStart.includes("T");
        const payload = {
    id: ev.id,
    title: ev.title,
    summary: ev.title,
    calendarId: ev.calendarId || null,
    calendar_id: ev.calendarId || null,
    calendarName: ev.calendarName || "",
    calendar_name: ev.calendarName || "",
    color: ev.color,
    location: ev.location || "",
    description: ev.description || ""
};

        if(isAllDay){
            let durationDays = 1;
            if(oldEnd){
                const diff = Math.round((new Date(`${oldEnd.slice(0,10)}T12:00:00`) - new Date(`${oldStart.slice(0,10)}T12:00:00`))/86400000);
                durationDays = Math.max(1,diff);
            }
            const endDate = new Date(`${newDateKey}T12:00:00`);
            endDate.setDate(endDate.getDate()+durationDays);
            payload.start = newDateKey;
            payload.end = localDateKey(endDate);
        }else{
            const oldStartDate = new Date(oldStart);
            const oldEndDate = oldEnd ? new Date(oldEnd) : new Date(oldStartDate.getTime()+3600000);
            const duration = Math.max(60000, oldEndDate-oldStartDate);
            const timePart = oldStart.slice(11);
            payload.start = `${newDateKey}T${timePart}`;
            const newStart = new Date(payload.start);
            payload.end = new Date(newStart.getTime()+duration).toISOString();
        }

        try{
            const response = await fetch(API_EVENTS_URL,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(payload)});
            const data = await response.json();
            if(!response.ok || !data.success) throw new Error(data.error || `HTTP ${response.status}`);
            showStatus("Termin Google Kalender'da taşındı");
            await loadEvents();
        }catch(error){
            showStatus(`Taşıma kaydedilemedi: ${error.message}`);
            await loadEvents();
        }
    }

    function buildMiniCalendar(){
        document.getElementById("gcMiniTitle").textContent = miniDate.toLocaleDateString(locale,{month:"long",year:"numeric"});
        const grid=document.getElementById("gcMiniGrid");
        let html=["M","D","M","D","F","S","S"].map(d=>`<div class="gc-mini-dow">${d}</div>`).join("");
        const first=new Date(miniDate.getFullYear(),miniDate.getMonth(),1);
        const offset=(first.getDay()+6)%7;
        const start=new Date(miniDate.getFullYear(),miniDate.getMonth(),1-offset);
        for(let i=0;i<42;i++){
            const d=new Date(start); d.setDate(start.getDate()+i);
            const dateKey=localDateKey(d);
            const isToday=dateKey===localDateKey(today);
            const isSelected=
                miniSelectedDate!==null &&
                dateKey===localDateKey(miniSelectedDate);
            const isOther=d.getMonth()!==miniDate.getMonth();

            html+=`<div class="${isToday?"gc-mini-active":""} ${isSelected&&!isToday?"gc-mini-selected":""} ${isOther?"gc-mini-other":""}" data-date="${dateKey}">${d.getDate()}</div>`;
        }
        grid.innerHTML=html;
        grid.querySelectorAll("[data-date]").forEach(el=>el.addEventListener("click",()=>{
            const d=new Date(`${el.dataset.date}T12:00:00`);
            miniSelectedDate=new Date(d);
            currentDate=new Date(d);
            miniDate=new Date(d.getFullYear(),d.getMonth(),1);
            currentView="day";
            document.getElementById("gcViewBtn").textContent="Tag ▾";
            buildMiniCalendar();
            loadEvents();
        }));
    }

    let currentView="month";

    function eventsForDate(dateKey){
        const search=(document.getElementById("gcSearchInput").value||"").trim().toLocaleLowerCase("tr-TR");
        return gcEvents.filter(event=>String(event.start).slice(0,10)===dateKey&&(!search||event.title.toLocaleLowerCase("tr-TR").includes(search))).sort((a,b)=>String(a.start).localeCompare(String(b.start)));
    }

    function renderEventChip(event){
        const el=document.createElement("div");
        el.className=`gc-event gc-${normalizeColor(event.color)}`;
        el.dataset.calendar=normalizeColor(event.color);
        el.dataset.eventId=event.id;
        
        // DRAG AND DROP - ETKİNLİK SÜRÜKLENEBİLİR YAPILIYOR
        el.setAttribute("draggable", "true");
        el.addEventListener("dragstart", (e) => {
            e.dataTransfer.setData("text/plain", event.id);
            e.dataTransfer.effectAllowed = "move";
        });

        const eventDate=new Date(event.start);
        const hasTime=String(event.start).includes("T");
        const time=hasTime&&!Number.isNaN(eventDate.getTime())?eventDate.toLocaleTimeString(locale,{hour:"2-digit",minute:"2-digit"}):"";
        el.textContent=`${time?time+" ":""}${event.title}`;
        el.title=el.textContent;
        el.addEventListener("click", (e) => { e.stopPropagation(); openModal(String(event.start).slice(0,10), event); });
        return el;
    }

    function buildMonthView(){
        const calendar=document.querySelector(".gc-calendar");
        calendar.classList.remove("gc-schedule");
        calendar.innerHTML='<div class="gc-weekdays"><div>MO</div><div>DI</div><div>MI</div><div>DO</div><div>FR</div><div>SA</div><div>SO</div></div><div class="gc-grid" id="gcCalendarGrid"></div>';
        document.getElementById("gcMonthTitle").textContent=currentDate.toLocaleDateString(locale,{month:"long",year:"numeric"});
        const grid=document.getElementById("gcCalendarGrid");
        const first=new Date(currentDate.getFullYear(),currentDate.getMonth(),1);
        const offset=(first.getDay()+6)%7;
        const start=new Date(currentDate.getFullYear(),currentDate.getMonth(),1-offset);
        for(let i=0;i<42;i++){
            const dateObj=new Date(start);dateObj.setDate(start.getDate()+i);
            const dateKey=localDateKey(dateObj);
            const isOther=dateObj.getMonth()!==currentDate.getMonth();
            const day=document.createElement("div");
            day.className="gc-day";
            day.dataset.date=dateKey;
            
            // DRAG AND DROP - GÜN KUTUSUNA BIRAKMA İZNİ
            day.addEventListener("dragover", (e) => {
                e.preventDefault(); // Bu olmazsa KIRMIZI YUVARLAK çıkar!
                day.style.backgroundColor = "#f1f3f4";
            });
            day.addEventListener("dragleave", (e) => {
                day.style.backgroundColor = "";
            });
            day.addEventListener("drop", (e) => {
                e.preventDefault();
                day.style.backgroundColor = "";
                const eventId = e.dataTransfer.getData("text/plain");
                if (eventId) updateEventDate(eventId, dateKey);
            });

            const date=document.createElement("div");date.className="gc-date"+(dateKey===localDateKey(today)?" gc-today":"")+(isOther?" gc-other":"");date.textContent=dateObj.getDate();day.appendChild(date);
            eventsForDate(dateKey).forEach(event=>day.appendChild(renderEventChip(event)));
            if(pageSource === "besichtigung"){
                day.addEventListener("click",()=>{
                    const modal=document.getElementById("kgBesichtigungTimeModal");

                    modal.dataset.date=dateKey;

                    document.getElementById("kgBesichtigungFirmaText").textContent=
                        pageFirma || "Besichtigungstermin";

                    document.getElementById("kgBesichtigungTimeInput").value="09:00";

                    modal.style.display="flex";

                    setTimeout(()=>{
                        document.getElementById("kgBesichtigungTimeInput").focus();
                    },50);
                });
            }else if(pageSource === "spaeter"){
                day.addEventListener("click",()=>{
                    const modal=document.getElementById("kgBesichtigungTimeModal");

                    modal.dataset.date=dateKey;
                    modal.dataset.source="spaeter";

                    document.getElementById("kgBesichtigungFirmaText").textContent=
                        pageFirma || "Telefonakquise";

                    document.getElementById("kgBesichtigungTimeInput").value="09:00";

                    modal.style.display="flex";

                    setTimeout(()=>{
                        document.getElementById("kgBesichtigungTimeInput").focus();
                    },50);
                });
            }else{
                day.addEventListener("dblclick",()=>openModal(dateKey));
            }

            grid.appendChild(day);
        }
    }

    function startOfWeek(date){const d=new Date(date);const diff=(d.getDay()+6)%7;d.setDate(d.getDate()-diff);d.setHours(0,0,0,0);return d}

    function buildScheduleView(daysCount){
        const calendar=document.querySelector(".gc-calendar");
        calendar.classList.add("gc-schedule");
        calendar.innerHTML="";
        const anchor=daysCount===1?new Date(currentDate):startOfWeek(currentDate);
        const dates=Array.from({length:daysCount},(_,i)=>{const d=new Date(anchor);d.setDate(anchor.getDate()+i);return d});
        document.getElementById("gcMonthTitle").textContent=daysCount===1?anchor.toLocaleDateString(locale,{day:"numeric",month:"long",year:"numeric"}):anchor.toLocaleDateString(locale,{month:"long",year:"numeric"});
        const cls=daysCount===1?"gc-dayview":"gc-week";
        const head=document.createElement("div");head.className=`gc-schedule-head ${cls}`;head.innerHTML='<div></div>'+dates.map(d=>`<div class="${localDateKey(d)===localDateKey(today)?"gc-head-today":""}">${d.toLocaleDateString(locale,{weekday:"short"}).toUpperCase()}<br><strong>${d.getDate()}</strong></div>`).join("");calendar.appendChild(head);
        
        const all=document.createElement("div");all.className=`gc-all-day-row-view ${cls}`;all.innerHTML='<div class="gc-all-day-label">GMT+02</div>';
        dates.forEach(d=>{
            const cell=document.createElement("div");
            cell.className="gc-all-day-cell";
            cell.dataset.date=localDateKey(d);
            
            // DRAG AND DROP - TÜM GÜN KUTUSUNA BIRAKMA
            cell.addEventListener("dragover", (e) => { e.preventDefault(); cell.style.backgroundColor = "#f1f3f4"; });
            cell.addEventListener("dragleave", (e) => { cell.style.backgroundColor = ""; });
            cell.addEventListener("drop", (e) => { e.preventDefault(); cell.style.backgroundColor = ""; const evId = e.dataTransfer.getData("text/plain"); if(evId) updateEventDate(evId, localDateKey(d)); });

            eventsForDate(localDateKey(d)).filter(e=>!String(e.start).includes("T")).forEach(e=>cell.appendChild(renderEventChip(e)));all.appendChild(cell)
        });
        calendar.appendChild(all);
        
        const timeGrid=document.createElement("div");timeGrid.className=`gc-time-grid ${cls}`;
        const labels=document.createElement("div");labels.className="gc-time-labels";for(let h=0;h<24;h++){const l=document.createElement("div");l.className="gc-time-label";l.style.top=`${h*60}px`;l.textContent=`${pad(h)}:00`;labels.appendChild(l)}timeGrid.appendChild(labels);
        
        dates.forEach(d=>{
            const col=document.createElement("div");
            col.className="gc-time-column";
            col.dataset.date=localDateKey(d);
            
            // DRAG AND DROP - SAATLİ SÜTUNLARA BIRAKMA
            col.addEventListener("dragover", (e) => { e.preventDefault(); col.style.backgroundColor = "#f8f9fa"; });
            col.addEventListener("dragleave", (e) => { col.style.backgroundColor = ""; });
            col.addEventListener("drop", (e) => { e.preventDefault(); col.style.backgroundColor = ""; const evId = e.dataTransfer.getData("text/plain"); if(evId) updateEventDate(evId, localDateKey(d)); });

            eventsForDate(localDateKey(d)).filter(e=>String(e.start).includes("T")).forEach(e=>{const sd=new Date(e.start);const ed=e.end?new Date(e.end):new Date(sd.getTime()+60*60000);const top=sd.getHours()*60+sd.getMinutes();const height=Math.max(22,Math.min(180,(ed-sd)/60000));const ev=renderEventChip(e);ev.classList.add("gc-time-event");ev.style.top=`${top}px`;ev.style.height=`${height}px`;col.appendChild(ev)});col.addEventListener("dblclick",()=>openModal(localDateKey(d)));if(localDateKey(d)===localDateKey(today)){const now=new Date();const line=document.createElement("div");line.className="gc-now-line";line.style.top=`${now.getHours()*60+now.getMinutes()}px`;col.appendChild(line)}timeGrid.appendChild(col)
        });
        calendar.appendChild(timeGrid);
        setTimeout(()=>{calendar.scrollTop=Math.max(0,(new Date().getHours()-2)*60)},0);
    }

    function buildAgendaView(){
        const calendar=document.querySelector(".gc-calendar");calendar.classList.remove("gc-schedule");calendar.innerHTML='<div class="gc-agenda" id="gcAgenda"></div>';
        document.getElementById("gcMonthTitle").textContent=currentDate.toLocaleDateString(locale,{month:"long",year:"numeric"});
        const agenda=document.getElementById("gcAgenda");const first=new Date(currentDate.getFullYear(),currentDate.getMonth(),1);const last=new Date(currentDate.getFullYear(),currentDate.getMonth()+1,0);let any=false;
        for(let d=new Date(first);d<=last;d.setDate(d.getDate()+1)){const list=eventsForDate(localDateKey(d));if(!list.length)continue;any=true;const row=document.createElement("div");row.className="gc-agenda-day";const date=document.createElement("div");date.className="gc-agenda-date";date.innerHTML=`${d.getDate()} ${d.toLocaleDateString(locale,{month:"long"})}<small>${d.toLocaleDateString(locale,{weekday:"long"})}</small>`;const events=document.createElement("div");list.forEach(e=>{const item=document.createElement("div");item.className="gc-agenda-event";const time=String(e.start).includes("T")?new Date(e.start).toLocaleTimeString(locale,{hour:"2-digit",minute:"2-digit"}):"Ganztägig";item.innerHTML=`<span class="gc-agenda-dot gc-${normalizeColor(e.color)}"></span><strong>${time}</strong><span>${e.title}</span>`;events.appendChild(item)});row.append(date,events);agenda.appendChild(row)}
        if(!any)agenda.innerHTML='<div class="gc-agenda-empty">Bu ay için termin yok.</div>';
    }

    function buildCalendar(){
        document.getElementById("gcBrandDay").textContent=today.getDate();
        if(currentView==="month")buildMonthView();
        else if(currentView==="week")buildScheduleView(7);
        else if(currentView==="day")buildScheduleView(1);
        else buildAgendaView();
        applyFilters();
    }

    function applyFilters(){
        document.querySelectorAll(".gc-calendar-row input").forEach(cb=>{
            document.querySelectorAll(`.gc-event[data-calendar="${cb.dataset.calendar}"]`).forEach(el=>el.style.display=cb.checked?"":"none");
        });
    }

    function openModal(dateKey=localDateKey(today), event=null){
        editingEventId = event ? event.id : null;
        editingCalendarId = event ? event.calendarId : null;
        document.getElementById("gcEventTitle").value=event?.title||"";
        document.getElementById("gcEventDate").value=event ? String(event.start).slice(0,10) : dateKey;
        const isAllDay = event ? !String(event.start).includes("T") : true;
        document.getElementById("gcAllDay").checked=isAllDay;
        document.getElementById("gcEventTime").style.display=isAllDay?"none":"inline-block";
        if(event && !isAllDay){
            const d=new Date(event.start);
            document.getElementById("gcEventTime").value=`${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }
        let endDate = event?.end ? String(event.end).slice(0,10) : dateKey;
        if(event && isAllDay && endDate>String(event.start).slice(0,10)){
            const inclusive = new Date(`${endDate}T12:00:00`); inclusive.setDate(inclusive.getDate()-1); endDate=localDateKey(inclusive);
        }
        document.getElementById("gcEventEndDate").value=endDate||dateKey;
        document.getElementById("gcEventColor").value=normalizeColor(event?.color||"blue");
                const calendarSelect = document.getElementById("gcCalendarName");
        const colorSelect = document.getElementById("gcEventColor");

        const CALENDAR_TO_COLOR = {
            "Kalender": "blue",
            "Bayram": "pink",
            "Besichtigungstermine": "orange",
            "Fensterreinigung": "green",
            "Geburtstage": "yellow",
            "Telefonakquise": "purple"
        };

        const COLOR_TO_CALENDAR = {
            "blue": "Kalender",
            "pink": "Bayram",
            "orange": "Besichtigungstermine",
            "green": "Fensterreinigung",
            "yellow": "Geburtstage",
            "purple": "Telefonakquise"
        };

        if (event) {
            calendarSelect.value =
                event.calendarName ||
                COLOR_TO_CALENDAR[normalizeColor(event.color || "blue")] ||
                "Kalender";

            colorSelect.value =
                normalizeColor(event.color) ||
                CALENDAR_TO_COLOR[calendarSelect.value] ||
                "blue";
        } else {
            calendarSelect.value = "Kalender";
            colorSelect.value = "blue";
        }
        
        document.getElementById("gcLocation").value=event?.location||"";
        document.getElementById("gcDescription").value=event?.description||"";
        document.getElementById("gcDeleteBtn").style.display=editingEventId?"inline-block":"none";
        document.getElementById("gcModal").classList.add("gc-show");
        setTimeout(()=>document.getElementById("gcEventTitle").focus(),50);
    }

    async function saveEvent(){
        const title=document.getElementById("gcEventTitle").value.trim()||"Neuer Termin";
        const date=document.getElementById("gcEventDate").value;
        const selectedEndDate=document.getElementById("gcEventEndDate").value||date;
        const time=document.getElementById("gcEventTime").value||"09:00";
        const color=document.getElementById("gcEventColor").value;
        const calendarName=document.getElementById("gcCalendarName").value;
        const isAllDay=document.getElementById("gcAllDay").checked;
        let start, end;
        if(isAllDay){
            start=date;
            const exclusiveEnd=new Date(`${selectedEndDate}T12:00:00`); exclusiveEnd.setDate(exclusiveEnd.getDate()+1);
            end=localDateKey(exclusiveEnd);
        }else{
            start=`${date}T${time}:00`;
            const endDateObj=new Date(`${selectedEndDate}T${time}:00`); endDateObj.setHours(endDateObj.getHours()+1);
            end=endDateObj.toISOString();
        }
const payload={
    id:editingEventId,
    title,
    summary:title,
    start,
    end,
    color,
    location:document.getElementById("gcLocation").value||"",
    description:document.getElementById("gcDescription").value||"",
    calendarId:editingEventId ? editingCalendarId : null,
    calendar_id:editingEventId ? editingCalendarId : null,
    calendarName:calendarName,
    calendar_name:calendarName,
    recurrence:document.getElementById("gcRepeat").value,
    availability:document.getElementById("gcAvailability")?.value||"free",
    visibility:document.getElementById("gcVisibility")?.value||"default",
    guests:(document.getElementById("gcGuests").value||"").split(",").map(v=>v.trim()).filter(Boolean)
};
        try{
            const response=await fetch(API_EVENTS_URL,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(payload)});
            const data=await response.json();
            if(!response.ok || !data.success) throw new Error(data.error || `HTTP ${response.status}`);
            document.getElementById("gcModal").classList.remove("gc-show");
            editingEventId=null;
            showStatus("Termin Google Kalender'a kaydedildi");
            await loadEvents();

            const source=new URLSearchParams(window.location.search).get("source");

            if(source === "besichtigung"){

                const ok=confirm(
                    "Termin wurde gespeichert.\n\nMöchten Sie jetzt die Terminbestätigung per E-Mail vorbereiten?"
                );

                if(ok){
                    const parts=String(date||"").split("-");
                    const datumDE=parts.length===3
                        ? parts[2]+"."+parts[1]+"."+parts[0]
                        : date||"";

                    window.parent.postMessage({
                        type:"kg-besichtigung-open-mail",
                        firma:title||"",
                        datum:datumDE,
                        uhrzeit:isAllDay ? "" : time||""
                    },"*");
                }
            }
        }catch(error){
            showStatus(`Kayıt başarısız: ${error.message}`);
        }
    }
    document.getElementById("kgBesichtigungTimeCancel").addEventListener("click",()=>{
        document.getElementById("kgBesichtigungTimeModal").style.display="none";
    });

    document.getElementById("kgBesichtigungTimeSave").addEventListener("click",async()=>{
        const modal=document.getElementById("kgBesichtigungTimeModal");
        const date=modal.dataset.date;
        const time=document.getElementById("kgBesichtigungTimeInput").value||"09:00";

        const title=`${pageFirma} ${time}`.trim();
        const start=date;

        const endDate=new Date(`${date}T12:00:00`);
        endDate.setDate(endDate.getDate()+1);

        const isSpaeter=pageSource === "spaeter";

        const payload={
            title,
            summary:title,
            start,
            end:localDateKey(endDate),
            color:isSpaeter ? "purple" : "orange",
            calendar_name:isSpaeter
                ? "Telefonakquise"
                : "Besichtigungstermine",
            location:"",
            description:"",
            recurrence:"Einmalig",
            availability:"free",
            visibility:"default",
            guests:[]
        };

        try{
            const response=await fetch(API_EVENTS_URL,{
                method:"POST",
                headers:{
                    "Content-Type":"application/json",
                    "Accept":"application/json"
                },
                body:JSON.stringify(payload)
            });

            const data=await response.json();

            if(!response.ok || !data.success){
                throw new Error(data.error || `HTTP ${response.status}`);
            }

            modal.style.display="none";
            showStatus("Termin Google Kalender'a kaydedildi");
            await loadEvents();

            if(pageSource === "besichtigung"){
                const ok=confirm(
                    "Termin wurde gespeichert.\n\nMöchten Sie jetzt die Terminbestätigung per E-Mail vorbereiten?"
                );

                if(ok){
                    const parts=String(date).split("-");
                    const datumDE=parts.length===3
                        ? parts[2]+"."+parts[1]+"."+parts[0]
                        : date;

                    window.parent.postMessage({
                        type:"kg-besichtigung-open-mail",
                        firma:pageFirma,
                        datum:datumDE,
                        uhrzeit:time
                    },"*");
                }
            }

        }catch(error){
            showStatus(`Kayıt başarısız: ${error.message}`);
        }
    });


    async function deleteEvent(){
        if(!editingEventId) return;
        if(!confirm("Bu termin Google Kalender'dan silinsin mi?")) return;
        try{
            const deleteUrl=
                `${API_EVENTS_URL}/${encodeURIComponent(editingEventId)}` +
                (editingCalendarId
                    ? `?calendarId=${encodeURIComponent(editingCalendarId)}`
                    : "");

            const response=await fetch(deleteUrl,{
                method:"DELETE",
                headers:{"Accept":"application/json"}
            });

            const data=await response.json();
            if(!response.ok || !data.success) throw new Error(data.error || `HTTP ${response.status}`);
            document.getElementById("gcModal").classList.remove("gc-show");
            editingEventId=null;
            showStatus("Termin silindi");
            await loadEvents();
        }catch(error){
            showStatus(`Silinemedi: ${error.message}`);
        }
    }

        const calendarCheckboxes = document.querySelectorAll(
        ".gc-calendar-row input"
    );

    calendarCheckboxes.forEach(cb => {
        const storageKey = `gc-calendar-visible-${cb.dataset.calendar}`;
        const savedValue = localStorage.getItem(storageKey);

        if (savedValue !== null) {
            cb.checked = savedValue === "true";
        }

        cb.addEventListener("change", function () {
            localStorage.setItem(
                storageKey,
                String(this.checked)
            );

            applyFilters();
        });
    });

    document.getElementById("gcCreateBtn").addEventListener("click",()=>openModal());
    document.getElementById("gcCancelBtn").addEventListener("click",()=>{editingEventId=null;document.getElementById("gcModal").classList.remove("gc-show")});
    document.getElementById("gcModal").addEventListener("click",e=>{if(e.target.id==="gcModal")e.currentTarget.classList.remove("gc-show")});
    document.getElementById("gcSaveBtn").addEventListener("click",saveEvent);
    document.getElementById("gcDeleteBtn").addEventListener("click",deleteEvent);
        const gcCalendarName = document.getElementById("gcCalendarName");
    const gcEventColor = document.getElementById("gcEventColor");

    const CALENDAR_COLOR_LINK = {
        "Kalender": "blue",
        "Bayram": "pink",
        "Besichtigungstermine": "orange",
        "Fensterreinigung": "green",
        "Geburtstage": "yellow",
        "Telefonakquise": "purple"
    };

    const COLOR_CALENDAR_LINK = {
        "blue": "Kalender",
        "pink": "Bayram",
        "orange": "Besichtigungstermine",
        "green": "Fensterreinigung",
        "yellow": "Geburtstage",
        "purple": "Telefonakquise"
    };

    gcCalendarName.addEventListener("change", function () {
        gcEventColor.value =
            CALENDAR_COLOR_LINK[this.value] ||
            "blue";
    });

    gcEventColor.addEventListener("change", function () {
        gcCalendarName.value =
            COLOR_CALENDAR_LINK[this.value] ||
            "Kalender";
    });

    document.getElementById("gcSearchInput").addEventListener("input",buildCalendar);
    document.getElementById("gcMiniPrev").addEventListener("click",()=>{miniDate=new Date(miniDate.getFullYear(),miniDate.getMonth()-1,1);buildMiniCalendar()});
    document.getElementById("gcMiniNext").addEventListener("click",()=>{miniDate=new Date(miniDate.getFullYear(),miniDate.getMonth()+1,1);buildMiniCalendar()});
    document.getElementById("gcMenuBtn").addEventListener("click",()=>{const sidebar=document.getElementById("gcSidebar"),body=document.getElementById("gcBody");if(sidebar.style.display==="none"){sidebar.style.display="";body.style.gridTemplateColumns="256px minmax(0,1fr) 52px"}else{sidebar.style.display="none";body.style.gridTemplateColumns="minmax(0,1fr) 52px"}});


    document.getElementById("gcAllDay").addEventListener("change",e=>{document.getElementById("gcEventTime").style.display=e.target.checked?"none":"inline-block"});
    document.getElementById("gcEventDate").addEventListener("change",e=>{if(!document.getElementById("gcEventEndDate").value||document.getElementById("gcEventEndDate").value<e.target.value)document.getElementById("gcEventEndDate").value=e.target.value});

    const gcViewBtn=document.getElementById("gcViewBtn");
    const gcViewMenu=document.getElementById("gcViewMenu");
    const labels={month:"Monat",week:"Woche",day:"Tag",agenda:"Terminübersicht"};
    gcViewBtn.addEventListener("click",e=>{e.stopPropagation();gcViewMenu.classList.toggle("gc-show")});
    gcViewMenu.querySelectorAll("button").forEach(btn=>btn.addEventListener("click",()=>{
        currentView=btn.dataset.view;
        if((currentView==="week"||currentView==="day")&&currentDate.getFullYear()===today.getFullYear()&&currentDate.getMonth()===today.getMonth())currentDate=new Date(today);
        gcViewBtn.textContent=`${labels[currentView]} ▾`;
        gcViewMenu.classList.remove("gc-show");
        loadEvents();
    }));
    document.addEventListener("click",e=>{if(!document.getElementById("gcViewWrap").contains(e.target))gcViewMenu.classList.remove("gc-show")});

    function navigate(direction){
        if(currentView==="month"||currentView==="agenda")currentDate=new Date(currentDate.getFullYear(),currentDate.getMonth()+direction,1);
        else if(currentView==="week")currentDate=new Date(currentDate.getFullYear(),currentDate.getMonth(),currentDate.getDate()+7*direction);
        else currentDate=new Date(currentDate.getFullYear(),currentDate.getMonth(),currentDate.getDate()+direction);
        miniDate=new Date(currentDate.getFullYear(),currentDate.getMonth(),1);buildMiniCalendar();loadEvents();
    }
    document.getElementById("gcPrevBtn").onclick=()=>navigate(-1);
    document.getElementById("gcNextBtn").onclick=()=>navigate(1);
    document.getElementById("gcTodayBtn").onclick=()=>{currentDate=new Date(today);miniDate=new Date(today.getFullYear(),today.getMonth(),1);buildMiniCalendar();loadEvents()};

    buildMiniCalendar();
    buildCalendar();
    loadEvents();
})();
</script>

{% endblock %}
