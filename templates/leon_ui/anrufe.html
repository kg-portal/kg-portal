<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Inter,Arial,Helvetica,sans-serif;
    background:#f3f6f9;
    color:#20303b;
}

button,input,select{font:inherit}

.app{
    display:grid;
    grid-template-columns:235px minmax(0,1fr);
    min-height:100vh;
}

.call-status{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:5px 10px;
    border-radius:999px;
    font-size:11px;
    font-weight:800;
    white-space:nowrap;
}

.call-status::before{
    content:"";
    width:7px;
    height:7px;
    border-radius:50%;
}

/* Aranıyor */
.call-status.calling{
    background:#fff4dc;
    color:#946200;
}

.call-status.calling::before{
    background:#f4a423;
}

/* Canlı görüşme */
.call-status.live{
    background:#e2f8f1;
    color:#137555;
}

.call-status.live::before{
    background:#20bf8f;
    animation:pulse 1.2s infinite;
}

/* Bitti */
.call-status.ended{
    background:#edf1f4;
    color:#62717b;
}

.call-status.ended::before{
    background:#8b9aa4;
}

/* Cevapsız / meşgul */
.call-status.failed{
    background:#fdeaea;
    color:#b13c43;
}

.call-status.failed::before{
    background:#ef5c62;
}

/* Diğer */
.call-status.other{
    background:#edf5f9;
    color:#40677c;
}

.call-status.other::before{
    background:#5d8da6;
}

.live-row{
    background:#fbfffd;
}

.live-row td:first-child{
    box-shadow:inset 3px 0 0 #20bf8f;
}

.live-duration{
    color:#15946c;
    font-weight:800;
}

@keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(32,191,143,.35)}
    70%{box-shadow:0 0 0 6px rgba(32,191,143,0)}
    100%{box-shadow:0 0 0 0 rgba(32,191,143,0)}
}
.call-result-pills{display:flex;gap:5px;flex-wrap:wrap;min-width:260px}
.call-result-pill{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;border:1px solid #e2e8f0;background:#f8fafc;color:#64748b;font-size:11px;font-weight:800;white-space:nowrap;opacity:1}
.call-result-pill.active{opacity:1}
.call-result-pill.interested.active{background:#eff6ff;border-color:#93c5fd;color:#2563eb}
.call-result-pill.callback.active{background:#eff6ff;border-color:#93c5fd;color:#1e40af}
.call-result-pill.invoice.active{background:#fffbeb;border-color:#fcd34d;color:#b45309}
.call-result-pill.no-interest.active{background:#fef2f2;border-color:#fca5a5;color:#b91c1c}
/* Notfall: laufenden Anruf beenden */
.call-hangup-btn{display:inline-flex;align-items:center;padding:5px 12px;border:0;border-radius:8px;background:#dc2626;color:#fff;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}
.call-hangup-btn:hover{background:#b91c1c}
.call-hangup-btn:disabled{opacity:.6;cursor:wait}
</style>

{% raw %}<style id="kg-premium">
/* ===== PREMIUM (einheitliches Design) ===== */
/* Nur Aussehen – Schrift, Kopf-Kachel, Kacheln, Tabellen, Knöpfe, Felder, Start-Animation.
   Keine Funktion, keine IDs/Handler geändert. */
html, body { font-family: Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important; }

@keyframes kgRein { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes lpWachsen { from { transform: scaleY(0); } to { transform: none; } }
@keyframes lpBreit { from { transform: scaleX(0); } to { transform: none; } }
@keyframes lpBogen { from { stroke-dasharray: 0 100; } }

/* Seitenfläche */
html body .business-portal-card {
  background:
    radial-gradient(900px 420px at 100% 0%, rgba(37,99,235,.05), transparent 60%),
    #f8fbff !important;
  border-color: #e6ebf2 !important;
}

/* Kopf-Kachel (Systemblau) */
html body .business-portal-card .kgb-hero {
  background:
    radial-gradient(520px 230px at 90% -20%, rgba(255,255,255,.26), transparent 60%),
    radial-gradient(420px 220px at 0% 120%, rgba(56,189,248,.25), transparent 60%),
    linear-gradient(135deg, #1e40af, #2563eb) !important;
  border-radius: 24px !important;
  box-shadow: 0 24px 50px -28px rgba(29,78,216,.7) !important;
  animation: kgRein .6s cubic-bezier(.22,1,.36,1) backwards;
}
html body .business-portal-card .kgb-hero::before {
  content: "Leon · Telefon-KI";
  display: block;
  margin: 0 0 8px;
  font-size: 11.5px;
  font-weight: 800;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: #bfdbfe;
}
html body .business-portal-card .kgb-hero h1,
html body .business-portal-card .kgb-hero .page-title {
  font-size: 34px !important;
  font-weight: 900 !important;
  letter-spacing: -.9px !important;
}
html body .business-portal-card .kgb-hero p,
html body .business-portal-card .kgb-hero .meta {
  color: #dbeafe !important;
  font-size: 13.5px !important;
  font-weight: 600 !important;
}
html body .business-portal-card .kgb-hero button,
html body .business-portal-card .kgb-hero .btn,
html body .business-portal-card .kgb-hero .back-btn,
html body .business-portal-card .kgb-hero a.kg-action {
  border-radius: 12px !important;
  font-weight: 900 !important;
  transition: translate .2s, box-shadow .2s, background-color .2s !important;
}
html body .business-portal-card .kgb-hero button:not(:disabled):hover,
html body .business-portal-card .kgb-hero .back-btn:hover,
html body .business-portal-card .kgb-hero a.kg-action:hover {
  translate: 0 -2px;
  box-shadow: 0 12px 24px -14px rgba(15,23,42,.6) !important;
}
html body .business-portal-card .kgb-hero .btn-primary:not(:disabled),
html body .business-portal-card .kgb-hero .kg-action {
  background: #ffffff !important;
  color: #1e40af !important;
  border-color: #ffffff !important;
}
html body .business-portal-card .kgb-hero .kg-pill,
html body .business-portal-card .kgb-hero .call-status,
html body .business-portal-card .kgb-hero .saved-status {
  border-radius: 999px !important;
  font-weight: 800 !important;
  backdrop-filter: blur(4px);
}

/* Kennzahl-Kacheln im Kopf: helle Fläche + farbiges Symbol-Quadrat (wie Leon-Übersicht) */
html body .business-portal-card .kgb-hero .summary-grid,
html body .business-portal-card .kgb-hero .kg-grid-4 { gap: 14px !important; }
html body .business-portal-card .kgb-hero .summary-card,
html body .business-portal-card .kgb-hero .kg-stat {
  display: flex !important;
  flex-direction: column-reverse;
  justify-content: center;
  position: relative !important;
  overflow: hidden !important;
  min-height: 78px !important;
  padding: 15px 16px 15px 70px !important;
  background: #f8fbff !important;
  border: 1px solid #e6edf7 !important;
  border-radius: 16px !important;
  box-shadow: 0 16px 30px -24px rgba(15,23,42,.65) !important;
  animation: kgRein .6s cubic-bezier(.22,1,.36,1) backwards;
  animation-delay: calc(var(--i, 0) * 70ms + 80ms);
  transition: translate .2s, transform .2s, box-shadow .2s;
}
html body .business-portal-card .kgb-hero .summary-card:hover,
html body .business-portal-card .kgb-hero .kg-stat:hover {
  translate: 0 -2px;
  box-shadow: 0 22px 36px -24px rgba(15,23,42,.7) !important;
}
html body .business-portal-card .kgb-hero .summary-card::after,
html body .business-portal-card .kgb-hero .kg-stat::after {
  content: "";
  position: absolute;
  top: calc(50% - 19px);
  left: 17px;
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: var(--lp-ic, none) center / 19px 19px no-repeat,
              linear-gradient(135deg, var(--lp-a, #3b82f6), var(--lp-b, #1d4ed8));
  box-shadow: 0 10px 18px -10px var(--lp-b, #1d4ed8);
}
html body .business-portal-card .kgb-hero .summary-card span,
html body .business-portal-card .kgb-hero .kg-stat span {
  display: block !important;
  margin-top: 6px !important;
  color: #64748b !important;
  font-size: 11px !important;
  font-weight: 800 !important;
  letter-spacing: 1px !important;
  line-height: 1.3 !important;
  text-transform: uppercase !important;
}
html body .business-portal-card .kgb-hero .summary-card strong,
html body .business-portal-card .kgb-hero .kg-stat strong {
  display: block !important;
  margin-top: 0 !important;

  font-size: 28px !important;
  font-weight: 900 !important;
  letter-spacing: -1px !important;
  line-height: 1 !important;
  font-variant-numeric: tabular-nums;
}

/* Tabellen (Bildschirm-Listen) */
html body .business-portal-card table thead th {
  background: #f8fafc !important;
  color: #64748b !important;
  font-size: 11px !important;
  font-weight: 800 !important;
  letter-spacing: .9px !important;
  text-transform: uppercase !important;
  border-bottom: 1px solid #e6ebf2 !important;
}
html body .business-portal-card table tbody td { border-color: #eef2f7 !important; }
html body .business-portal-card table tbody tr > td { transition: background-color .15s; }
html body .business-portal-card table tbody tr:hover > td { background: #f8fbff !important; }

/* Knöpfe */
html body .business-portal-card button,
html body .modal button {
  transition: translate .2s, box-shadow .2s, background-color .2s, border-color .2s, color .2s !important;
}
html body .business-portal-card button:not(:disabled):hover,
html body .modal button:not(:disabled):hover { translate: 0 -2px; }
html body .business-portal-card .btn-primary:not(:disabled),
html body .modal .btn-primary:not(:disabled) {
  background: linear-gradient(135deg, #3b82f6, #1d4ed8) !important;
  border-color: transparent !important;
  color: #ffffff !important;
  border-radius: 12px !important;
  font-weight: 800 !important;
  box-shadow: 0 10px 20px -12px rgba(37,99,235,.85) !important;
}
html body .business-portal-card .btn-primary:not(:disabled):hover,
html body .modal .btn-primary:not(:disabled):hover { box-shadow: 0 14px 26px -12px rgba(37,99,235,.9) !important; }
html body .business-portal-card .btn-secondary,
html body .modal .btn-secondary {
  border-radius: 12px !important;
  font-weight: 800 !important;
}
html body .business-portal-card .btn-danger,
html body .modal .btn-danger {
  border-radius: 12px !important;
  font-weight: 800 !important;
}

/* Eingabefelder */
html body .business-portal-card input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="color"]),
html body .business-portal-card select,
html body .business-portal-card textarea,
html body .modal input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="color"]),
html body .modal select,
html body .modal textarea {
  border-radius: 12px !important;
  border-color: #dbe3ef !important;
  transition: border-color .2s, box-shadow .2s;
}
html body .business-portal-card input:focus,
html body .business-portal-card select:focus,
html body .business-portal-card textarea:focus,
html body .modal input:focus,
html body .modal select:focus,
html body .modal textarea:focus {
  outline: none !important;
  border-color: #2563eb !important;
  box-shadow: 0 0 0 4px rgba(37,99,235,.12) !important;
}

/* Fenster (Modals) – nur Form, keine Animation */
html body .modal {
  border-radius: 24px !important;
  border-color: #e6ebf2 !important;
  box-shadow: 0 40px 80px -40px rgba(15,23,42,.55) !important;
}

/* ---------- Kennzahlen-/Grafik-Kacheln (neu, nur lesend) ---------- */
html body .lp-bento {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 16px;
  margin: 0 0 22px;
}
html body .lp-t {
  position: relative;
  min-width: 0;
  padding: 20px 22px;
  background: #ffffff;
  border: 1px solid #e6ebf2;
  border-radius: 24px;
  box-shadow: 0 18px 40px -30px rgba(15,23,42,.45);
  color: #0f172a;
  animation: kgRein .6s cubic-bezier(.22,1,.36,1) backwards;
  animation-delay: calc(var(--i, 0) * 70ms + 120ms);
  transition: translate .2s, box-shadow .2s;
}
html body .lp-t:hover { translate: 0 -2px; box-shadow: 0 26px 46px -30px rgba(15,23,42,.5); }
html body .lp-s3 { grid-column: span 3; }
html body .lp-s4 { grid-column: span 4; }
html body .lp-s5 { grid-column: span 5; }
html body .lp-s6 { grid-column: span 6; }
html body .lp-s7 { grid-column: span 7; }
html body .lp-s8 { grid-column: span 8; }

  display: flex;

  justify-content: space-between;
  gap: 10px;

}
html body .lp-leer { padding: 22px 0; color: #94a3b8; font-size: 12.5px; font-weight: 700; text-align: center; }
html body .lp-svg { display: block; width: 100%; height: auto; overflow: visible; }
html body .lp-svg text { fill: currentColor; font-family: inherit; text-anchor: middle; }
html body .lp-spur { fill: rgba(148,163,184,.13); }
html body .lp-saeule {

html body .lp-ruhig .lp-saeule,
html body .lp-ruhig .lp-bogen,
html body .lp-ruhig .lp-hb-spur > i { animation: none; }

  html body .lp-s3, html body .lp-s4, html body .lp-s5 { grid-column: span 3; }

<body>

<div class="kg-business-shell">



<main class="business-portal-main"><section class="business-portal-card kg-page">

<section class="kgb-hero">
<div class="kg-page-head">
    <div>
        <h1>Anrufe</h1>
        <p>Alle Telefonate durchsuchen, filtern und direkt ins Gesprächsdetail springen.</p>
    </div>

    <div class="kg-pill">
        ● Live-Daten aus /api/calls
    </div>
</div>


<div class="kg-grid-4">

    <div class="kg-card kg-stat">
        <span>Anrufe gesamt</span>
        <strong id="mTotal">0</strong>
    </div>

    <div class="kg-card kg-stat">
        <span>Mit Ergebnis</span>
        <strong id="mResult">0</strong>
    </div>

    <div class="kg-card kg-stat">
        <span>Rückruf</span>
        <strong id="mCallback">0</strong>
    </div>

    <div class="kg-card kg-stat">
        <span>Ø Dauer</span>
        <strong id="mDuration">0:00</strong>
    </div>

</div>
</section>



<div class="kg-card kg-toolbar">

    <input
        id="qInput"
        class="kg-input"
        placeholder="Firma, Telefonnummer, Zusammenfassung ..."
    >

    <select id="statusFilter" class="kg-select">
        <option value="">Alle Status</option>
    </select>

    <select id="resultFilter" class="kg-select">
        <option value="">Alle Ergebnisse</option>
    </select>

</div>


<div class="kg-card kg-table-card">

<table class="kg-table">

<thead>
<tr>
    <th>Datum</th>
    <th>Kontakt</th>
    <th>Telefon</th>
    <th>Status</th>
    <th>Ergebnis</th>
    <th>Dauer</th>
    <th>Score</th>
    <th></th>
</tr>
</thead>

<tbody id="rows"></tbody>

</table>

<div id="empty" class="kg-empty" style="display:none">
    Keine Anrufe vorhanden.
</div>

</div>

</section></main>

</div>


<script>

let calls = [];

/* Anrufe, für die „Beenden“ gerade läuft */
const hangingUp = new Set();


const qInput =
    document.getElementById("qInput");

const statusFilter =
    document.getElementById("statusFilter");

const resultFilter =
    document.getElementById("resultFilter");

const rows =
    document.getElementById("rows");

const empty =
    document.getElementById("empty");

const mTotal =
    document.getElementById("mTotal");

const mResult =
    document.getElementById("mResult");

const mCallback =
    document.getElementById("mCallback");

const mDuration =
    document.getElementById("mDuration");


const ACTIVE_STATUSES = new Set([
    "OpenAI wird vorbereitet",
    "OpenAI wird verbunden",
    "Kunde wird angerufen",
    "Gestartet",
    "Klingelt",
    "Verbunden",
    "Warteschlange",
    "Vorbereitet"
]);


function esc(value){

    return String(value ?? "")
        .replace(
            /[&<>"']/g,
            c => ({
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"
            }[c])
        );
}


function parseDate(value){

    if(!value){
        return null;
    }

    const raw =
        String(value).trim();

    let date;

    if(
        raw.includes("T")
        ||
        raw.endsWith("Z")
    ){
        date = new Date(raw);
    }else{
        date = new Date(
            raw.replace(" ","T") + "Z"
        );
    }

    if(
        isNaN(date.getTime())
    ){
        return null;
    }

    return date;
}


function fmtDate(value){

    const date =
        parseDate(value);

    if(!date){
        return esc(value || "—");
    }

    return date.toLocaleString(
        "de-DE",
        {
            dateStyle:"short",
            timeStyle:"short"
        }
    );
}


function fmtSec(value){

    let seconds =
        Number(value || 0);

    seconds =
        Math.max(
            0,
            Math.floor(seconds)
        );

    const minutes =
        Math.floor(seconds / 60);

    const rest =
        seconds % 60;

    return (
        minutes
        + ":"
        + String(rest).padStart(2,"0")
    );
}


function isActive(call){

    return ACTIVE_STATUSES.has(
        String(call.status || "")
    );
}


function getDuration(call){

    const stored =
        Number(
            call.duration_seconds
            ||
            call.recording_duration_seconds
            ||
            0
        );

    if(
        stored > 0
        ||
        !isActive(call)
    ){
        return stored;
    }

    const start =
        parseDate(
            call.started_at
            ||
            call.created_at
        );

    if(!start){
        return 0;
    }

    return Math.max(
        0,
        Math.floor(
            (
                Date.now()
                -
                start.getTime()
            )
            / 1000
        )
    );
}


function getStatusInfo(status){

    status =
        String(status || "");


    if(
        status === "Verbunden"
        ||
        status === "Gestartet"
    ){
        return {
            css:"live",
            text:"Im Gespräch"
        };
    }


    if(
        status === "Klingelt"
    ){
        return {
            css:"calling",
            text:"Klingelt"
        };
    }


    if(
        status === "Kunde wird angerufen"
    ){
        return {
            css:"calling",
            text:"Wird angerufen"
        };
    }


    if(
        status === "OpenAI wird vorbereitet"
        ||
        status === "OpenAI wird verbunden"
        ||
        status === "Vorbereitet"
    ){
        return {
            css:"calling",
            text:"Wird vorbereitet"
        };
    }


    if(
        status === "Warteschlange"
    ){
        return {
            css:"calling",
            text:"Warteschlange"
        };
    }


    if(
        status === "Beendet"
    ){
        return {
            css:"ended",
            text:"Beendet"
        };
    }


    if(
        status === "Nicht erreichbar"
    ){
        return {
            css:"failed",
            text:"Nicht erreichbar"
        };
    }


    if(
        status === "Besetzt"
    ){
        return {
            css:"failed",
            text:"Besetzt"
        };
    }


    if(
        status === "Fehler"
        ||
        status === "OpenAI Fehler"
        ||
        status === "Abgebrochen"
    ){
        return {
            css:"failed",
            text:status
        };
    }


    return {
        css:"other",
        text:status || "—"
    };
}


function createStatusBadge(call){

    const info =
        getStatusInfo(
            call.status
        );

    return `
        <span class="call-status ${info.css}">
            ${esc(info.text)}
        </span>
    `;
}


function resultPill(name,currentResult){
    const normalized = currentResult === "Gesperrt" ? "Kein Interesse" : String(currentResult || "");
    const active = normalized === name;
    const cssMap = {"Interessiert":"interested","Rückruf":"callback","Rechnung":"invoice","Kein Interesse":"no-interest"};
    return '<span class="call-result-pill ' + cssMap[name] + (active ? ' active' : '') + '">' + esc(name === 'Rechnung' ? 'Besichtigung' : name) + '</span>';
}

function updateMetrics(){

    mTotal.textContent =
        calls.length;


    mResult.textContent =
        calls.filter(
            call => call.result
        ).length;


    mCallback.textContent =
        calls.filter(
            call =>
                String(
                    call.result || ""
                )
                .toLowerCase()
                .includes("rückruf")
        ).length;


    const completed =
        calls.filter(
            call =>
                !isActive(call)
                &&
                getDuration(call) > 0
        );


    let average = 0;


    if(completed.length){

        const total =
            completed.reduce(
                (sum,call) =>
                    sum + getDuration(call),
                0
            );

        average =
            Math.round(
                total / completed.length
            );
    }


    mDuration.textContent =
        fmtSec(average);
}


function updateFilters(){

    const selectedStatus =
        statusFilter.value;

    const selectedResult =
        resultFilter.value;


    const statuses =
        [
            ...new Set(
                calls
                    .map(call => call.status)
                    .filter(Boolean)
            )
        ].sort();


    const results =
        [
            ...new Set(
                calls
                    .map(call => call.result)
                    .filter(Boolean)
            )
        ].sort();


    statusFilter.innerHTML =
        '<option value="">Alle Status</option>'
        +
        statuses.map(
            value =>
                `<option value="${esc(value)}">${esc(getStatusInfo(value).text)}</option>`
        ).join("");


    resultFilter.innerHTML =
        '<option value="">Alle Ergebnisse</option>'
        +
        results.map(
            value =>
                `<option value="${esc(value)}">${esc(value)}</option>`
        ).join("");


    if(
        statuses.includes(
            selectedStatus
        )
    ){
        statusFilter.value =
            selectedStatus;
    }


    if(
        results.includes(
            selectedResult
        )
    ){
        resultFilter.value =
            selectedResult;
    }
}


function render(){

    const search =
        qInput.value
            .trim()
            .toLowerCase();


    const selectedStatus =
        statusFilter.value;


    const selectedResult =
        resultFilter.value;


    let list =
        calls.filter(
            call => {

                if(
                    selectedStatus
                    &&
                    call.status !== selectedStatus
                ){
                    return false;
                }


                if(
                    selectedResult
                    &&
                    call.result !== selectedResult
                ){
                    return false;
                }


                if(search){

                    const haystack = [
                        call.firma,
                        call.ansprechpartner,
                        call.phone_number,
                        call.summary
                    ]
                    .map(
                        value =>
                            String(value || "")
                                .toLowerCase()
                    )
                    .join(" ");


                    if(
                        !haystack.includes(search)
                    ){
                        return false;
                    }
                }


                return true;
            }
        );


    list.sort(
        (a,b) =>
            Number(b.id || 0)
            -
            Number(a.id || 0)
    );


    rows.innerHTML =
        list.map(
            call => {

                const active =
                    isActive(call);

                const duration =
                    getDuration(call);


                return `
                    <tr class="${active ? "live-row" : ""}">

                        <td>
                            ${fmtDate(call.created_at)}
                        </td>

                        <td>
                            <strong>
                                ${esc(call.firma || "Unbekannter Kontakt")}
                            </strong>

                            <br>

                            <small>
                                ${esc(call.ansprechpartner || "")}
                            </small>
                        </td>

                        <td>
                            ${esc(call.phone_number || "—")}
                        </td>

                        <td>
                            ${createStatusBadge(call)}
                        </td>

                        <td>
                            <div class="call-result-pills">
                                ${resultPill("Interessiert", call.result)}
                                ${resultPill("Rückruf", call.result)}
                                ${resultPill("Rechnung", call.result)}
                                ${resultPill("Kein Interesse", call.result)}
                                ${
                                    active
                                    ?
                                    `<button
                                        type="button"
                                        class="call-hangup-btn"
                                        data-hangup="${esc(call.id)}"
                                        ${hangingUp.has(String(call.id)) ? "disabled" : ""}
                                    >${hangingUp.has(String(call.id)) ? "Wird beendet …" : "Beenden"}</button>`
                                    :
                                    ""
                                }
                            </div>
                        </td>

                        <td class="${active ? "live-duration" : ""}">
                            ${fmtSec(duration)}
                        </td>

                        <td>
                            ${
                                call.score == null
                                ?
                                "—"
                                :
                                esc(call.score) + "/10"
                            }
                        </td>

                        <td>
                            <a
                                class="kg-link"
                                href="/leon-ui/gespraech/${call.id}"
                            >
                                Öffnen →
                            </a>
                        </td>

                    </tr>
                `;
            }
        ).join("");


    if(list.length){

        empty.style.display =
            "none";

    }else{

        empty.style.display =
            "block";

        empty.textContent =
            "Keine Anrufe vorhanden.";
    }
}


async function loadCalls(){

    try{

        const response =
            await fetch(
                "/leon-api/calls",
                {
                    cache:"no-store"
                }
            );


        const data =
            await response.json();


        if(
            !data.success
        ){
            throw new Error(
                data.error || "Unbekannter Fehler"
            );
        }


        calls =
            Array.isArray(data.calls)
            ?
            data.calls
            :
            [];


        updateMetrics();

        updateFilters();

        render();


    }catch(error){

        console.error(
            "Anrufe Fehler:",
            error
        );


        empty.style.display =
            "block";


        empty.textContent =
            "Anrufe konnten nicht geladen werden: "
            +
            error.message;
    }
}


/* Notfall: laufenden Anruf nach Sicherheitsabfrage beenden */
rows.addEventListener(
    "click",
    async event => {

        const button =
            event.target.closest("[data-hangup]");

        if(!button){
            return;
        }

        const callId =
            String(button.dataset.hangup || "");

        if(
            !callId
            ||
            hangingUp.has(callId)
        ){
            return;
        }

        if(
            !confirm(
                "Sind Sie sicher, dass Sie diesen Anruf jetzt beenden möchten?"
            )
        ){
            return;
        }

        hangingUp.add(callId);
        render();

        try{

            const response =
                await fetch(
                    "/leon-api/calls/" + encodeURIComponent(callId) + "/hangup",
                    {
                        method:"POST",
                        cache:"no-store"
                    }
                );

            const data =
                await response.json().catch(() => ({}));

            if(
                !response.ok
                ||
                !data.success
            ){
                throw new Error(
                    data.error || ("HTTP " + response.status)
                );
            }

        }catch(error){

            alert(
                "Der Anruf konnte nicht beendet werden: "
                +
                error.message
            );

        }finally{

            hangingUp.delete(callId);
            loadCalls();
        }
    }
);


qInput.addEventListener(
    "input",
    render
);


statusFilter.addEventListener(
    "change",
    render
);


resultFilter.addEventListener(
    "change",
    render
);


/* İlk yükleme */
loadCalls();


/* Backend'i her 2 saniyede yeniden oku */
setInterval(
    loadCalls,
    2000
);


/* Aktif görüşmenin süresini her saniye ilerlet */
setInterval(
    () => {

        if(
            calls.some(isActive)
        ){
            render();
        }

    },
    1000
);

</script>

(function () {

  if (window.kgLeonPremium) return;
  var LP = window.kgLeonPremium = {};

  LP.esc = function (v) {

      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  LP.n = function (v) { var x = Number(v); return isFinite(x) ? x : 0; };
  LP.zahl = function (text) {

    if (t.indexOf(",") >= 0) t = t.replace(/\./g, "").replace(",", ".");
    var x = parseFloat(t);
    return isFinite(x) ? x : 0;
  };
  LP.de = function (x, stellen) {
    return Number(x || 0).toLocaleString("de-DE", { minimumFractionDigits: stellen || 0, maximumFractionDigits: stellen || 0 });
  };
  LP.datum = function (v) {
    if (!v) return null;
    var raw = String(v).trim();
    var d = (raw.indexOf("T") >= 0 || /Z$/.test(raw)) ? new Date(raw) : new Date(raw.replace(" ", "T") + "Z");
    return isNaN(d.getTime()) ? null : d;
  };
  LP.tagKey = function (d) { return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); };
  LP.letzteTage = function (anzahl) {
    var out = [], h = new Date();
    for (var k = anzahl - 1; k >= 0; k--) {
      var d = new Date(h.getFullYear(), h.getMonth(), h.getDate() - k);
      out.push({
        key: LP.tagKey(d),
        l: ("0" + d.getDate()).slice(-2) + "." + ("0" + (d.getMonth() + 1)).slice(-2) + ".",
        s: k === 0 ? "heute" : TAGE[d.getDay()],
        hi: k === 0,
        v: 0
      });
    }
    return out;
  };
  LP.kachel = function (klasse, i, titel, em, inhalt) {
    return '<div class="lp-t ' + klasse + '" style="--i:' + i + '"><div class="lp-lbl"><span>' + titel + '</span>' +
      (em ? '<em>' + em + '</em>' : '') + '</div>' + (inhalt || '') + '</div>';
  };
  LP.leer = function (text) { return '<div class="lp-leer">' + LP.esc(text) + '</div>'; };

  /* Säulen: items [{l, s, v, hi, t}] */
  LP.saeulen = function (items, opt) {
    opt = opt || {};
    var w = Math.max(280, opt.w || (opt.ziel && opt.ziel.clientWidth) || 520), h = opt.h || 180, top = 20, unten = items.some(function (i) { return i.s; }) ? 36 : 22;
    var n = Math.max(1, items.length), gap = opt.gap == null ? 10 : opt.gap;
    var bw = (w - gap * (n - 1)) / n, hoch = h - top - unten;
    var max = Math.max.apply(null, [1].concat(items.map(function (i) { return LP.n(i.v); })));
    var s = '<svg class="lp-svg" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + LP.esc(opt.titel || '') + '">';
    items.forEach(function (it, k) {
      var x = k * (bw + gap), v = LP.n(it.v), bh = v ? Math.max(6, hoch * v / max) : 0;
      var y = top + hoch - bh, cx = (x + bw / 2).toFixed(1), r = Math.min(9, bw / 2.4).toFixed(1);
      s += '<rect class="lp-spur" x="' + x.toFixed(1) + '" y="' + top + '" width="' + bw.toFixed(1) + '" height="' + hoch + '" rx="' + r + '"/>';
      if (bh) {
        s += '<rect class="lp-saeule' + (it.hi ? ' hi' : '') + '" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) +
          '" height="' + bh.toFixed(1) + '" rx="' + r + '" style="animation-delay:' + (k * 45) + 'ms"><title>' + LP.esc(it.t || (it.l + ': ' + v)) + '</title></rect>';
        s += '<text class="lp-wert" x="' + cx + '" y="' + (y - 6).toFixed(1) + '">' + LP.de(v) + '</text>';
      }
      s += '<text class="lp-achse' + (it.hi ? ' hi' : '') + '" x="' + cx + '" y="' + (h - (it.s ? 19 : 5)) + '">' + LP.esc(it.l) + '</text>';
      if (it.s) s += '<text class="lp-achse2' + (it.hi ? ' hi' : '') + '" x="' + cx + '" y="' + (h - 5) + '">' + LP.esc(it.s) + '</text>';
    });
    return s + '</svg>';
  };

  /* Donut: teile [{l, v, c}] */
  LP.donut = function (teile, mitte, unter, titel) {
    var summe = teile.reduce(function (a, t) { return a + LP.n(t.v); }, 0);
    var aktiv = teile.filter(function (t) { return LP.n(t.v) > 0; }).length;
    var s = '<svg class="lp-svg" viewBox="0 0 120 120" role="img" aria-label="' + LP.esc(titel || '') + '">';
    s += '<circle class="lp-ring-spur" cx="60" cy="60" r="46"/>';
    var start = 0, luecke = aktiv > 1 ? 1.4 : 0;
    teile.forEach(function (t, k) {
      var v = LP.n(t.v);
      if (!v || !summe) return;
      var len = v / summe * 100, sicht = Math.max(.6, len - luecke);
      s += '<circle class="lp-bogen" cx="60" cy="60" r="46" pathLength="100" stroke="' + t.c + '" stroke-dasharray="' + sicht.toFixed(2) + ' ' +
        (100 - sicht).toFixed(2) + '" stroke-dashoffset="' + (-start).toFixed(2) + '" transform="rotate(-90 60 60)" style="animation-delay:' +
        (k * 90) + 'ms"><title>' + LP.esc(t.l + ': ' + v) + '</title></circle>';
      start += len;
    });
    s += '<text class="lp-mitte" x="60" y="' + (unter ? 62 : 68) + '">' + LP.esc(mitte) + '</text>';
    if (unter) s += '<text class="lp-mitte2" x="60" y="78">' + LP.esc(unter) + '</text>';
    return s + '</svg>';
  };

  /* Ring: anteil 0..1 */
  LP.ring = function (anteil, farbe, mitte, unter, titel) {
    var p = Math.max(0, Math.min(100, anteil * 100));
    var s = '<svg class="lp-svg" viewBox="0 0 120 120" role="img" aria-label="' + LP.esc(titel || '') + '">';
    s += '<circle class="lp-ring-spur" cx="60" cy="60" r="46"/>';
    if (p > 0) {
      s += '<circle class="lp-bogen" cx="60" cy="60" r="46" pathLength="100" stroke="' + farbe + '" stroke-linecap="round" stroke-dasharray="' +
        p.toFixed(2) + ' ' + (100 - p).toFixed(2) + '" transform="rotate(-90 60 60)"><title>' + LP.esc(titel || '') + '</title></circle>';
    }
    s += '<text class="lp-mitte" x="60" y="' + (unter ? 62 : 68) + '">' + LP.esc(mitte) + '</text>';
    if (unter) s += '<text class="lp-mitte2" x="60" y="78">' + LP.esc(unter) + '</text>';
    return s + '</svg>';
  };

  LP.legende = function (teile) {
    return '<ul class="lp-leg">' + teile.map(function (t) {
      return '<li><i style="background:' + t.c + '"></i><span>' + LP.esc(t.l) + '</span><b>' + LP.de(LP.n(t.v)) + '</b></li>';
    }).join('') + '</ul>';
  };

  /* Waagerechte Balken: zeilen [{l, wert, teile:[{v, c, l}], max}] */
  LP.hbalken = function (zeilen, max) {
    return '<div class="lp-hb">' + zeilen.map(function (z, k) {
      var m = Math.max(1, max || z.max || 1), teile = z.teile || [];
      var balken = teile.map(function (t) {
        var w = Math.max(0, Math.min(100, LP.n(t.v) / m * 100));
        return w > 0 ? '<i style="width:' + w.toFixed(2) + '%;background:' + t.c + ';animation-delay:' + (k * 70) + 'ms" title="' + LP.esc((t.l || z.l) + ': ' + LP.n(t.v)) + '"></i>' : '';
      }).join('');
      return '<div class="lp-hb-z"><span title="' + LP.esc(z.l) + '">' + LP.esc(z.l) + '</span><div class="lp-hb-spur">' + balken + '</div><b>' + LP.esc(z.wert) + '</b></div>';
    }).join('') + '</div>';
  };

  LP.mini = function (zeilen) {
    return '<ul class="lp-mini">' + zeilen.map(function (z) {
      return '<li><span>' + LP.esc(z[0]) + '</span><b>' + LP.esc(z[1]) + '</b></li>';
    }).join('') + '</ul>';
  };

  /* Bei Änderungen im beobachteten Bereich neu zeichnen (nur lesen) */
  LP.beobachte = function (el, fn) {
    var t = 0;
    function lauf() {
      t = 0;
      try { fn(); } catch (e) { if (window.console) console.warn("Premium-Grafik:", e); }
    }
    if (el && window.MutationObserver) {
      new MutationObserver(function () { if (!t) t = setTimeout(lauf, 80); })
        .observe(el, { childList: true, subtree: true, characterData: true });
    }
    lauf();
  };
  /* Nach dem ersten echten Zeichnen keine Wiederhol-Animation */
  LP.beruhigen = function (box) {
    if (box && !box.__lpRuhig) {
      box.__lpRuhig = true;
      setTimeout(function () { box.classList.add("lp-ruhig"); }, 1600);
    }
  };
})();

(function () {
  var LP = window.kgLeonPremium, hero = document.querySelector(".business-portal-card > .kgb-hero");
  if (!LP || !hero) return;
  var box = document.createElement("section");
  box.className = "lp-bento";
  box.setAttribute("aria-label", "Anrufe Kennzahlen");
  box.innerHTML =
    LP.kachel("lp-s5 lp-breit", 1, "Anrufe nach Uhrzeit", "alle Anrufe", '<div data-lp="std">' + LP.leer("Wird geladen …") + '</div>') +
    LP.kachel("lp-s4", 2, "Status der Anrufe", "", '<div data-lp="status">' + LP.leer("Wird geladen …") + '</div>') +
    LP.kachel("lp-s3", 3, "Gesprächsdauer", "beendete Anrufe", '<div data-lp="dauer">' + LP.leer("Wird geladen …") + '</div>');
  hero.insertAdjacentElement("afterend", box);

  var sig = null;
  function aktiv(c) { try { return typeof isActive === "function" && isActive(c); } catch (e) { return false; } }
  function dauer(c) { try { return typeof getDuration === "function" ? getDuration(c) : LP.n(c.duration_seconds); } catch (e) { return 0; } }
  function zeichnen() {
    var liste = (typeof calls !== "undefined" && Array.isArray(calls)) ? calls : [];
    var s = liste.map(function (c) { return c.id + ":" + (c.status || "") + ":" + (c.result || "") + ":" + (aktiv(c) ? "" : dauer(c)); }).join(",");
    if (sig !== null && s === sig) return;
    if (!liste.length && sig === null && !document.getElementById("rows").children.length &&
        document.getElementById("empty").style.display !== "block") return;
    sig = s;
    if (!liste.length) {
      ["std", "status", "dauer"].forEach(function (k) { box.querySelector('[data-lp="' + k + '"]').innerHTML = LP.leer("Noch keine Anrufe."); });
      return;
    }

    /* Uhrzeit */
    var proStd = {}, minH = 8, maxH = 18, jetzt = new Date().getHours();
    liste.forEach(function (c) {
      var d = LP.datum(c.created_at);
      if (!d) return;
      var h = d.getHours();
      proStd[h] = (proStd[h] || 0) + 1;
      if (h < minH) minH = h;
      if (h > maxH) maxH = h;
    });
    var std = [];
    for (var h = minH; h <= maxH; h++) {
      std.push({ l: ("0" + h).slice(-2), v: proStd[h] || 0, hi: h === jetzt, t: ("0" + h).slice(-2) + ":00–" + ("0" + h).slice(-2) + ":59 Uhr: " + (proStd[h] || 0) + " Anrufe" });
    }
    var zielStd = box.querySelector('[data-lp="std"]');
    zielStd.innerHTML = LP.saeulen(std, { ziel: zielStd, h: 176, gap: std.length > 16 ? 5 : 8, titel: "Anrufe nach Uhrzeit" });

    /* Status */
    var st = [
      { l: "Im Gespräch", c: "#16a34a", v: 0 },
      { l: "Wählt / klingelt", c: "#f59e0b", v: 0 },
      { l: "Beendet", c: "#2563eb", v: 0 },
      { l: "Anrufbeantworter", c: "#7c3aed", v: 0 },
      { l: "Nicht erreicht / Fehler", c: "#ef4444", v: 0 },
      { l: "Sonstige", c: "#94a3b8", v: 0 }
    ];
    liste.forEach(function (c) {
      var css = "other";
      try { css = typeof getStatusInfo === "function" ? getStatusInfo(c.status).css : "other"; } catch (e) {}
      var k = c.status === "Anrufbeantworter" ? 3 : css === "live" ? 0 : css === "calling" ? 1 : css === "ended" ? 2 : css === "failed" ? 4 : 5;
      st[k].v++;
    });
    box.querySelector('[data-lp="status"]').innerHTML = '<div class="lp-donut-zeile">' +
      LP.donut(st, LP.de(liste.length), "Anrufe", "Status der Anrufe") +
      LP.legende(st.filter(function (t, k) { return t.v > 0 || k === 2; })) + '</div>';

    /* Dauer */
    var b = [{ l: "< 1", v: 0 }, { l: "1–2", v: 0 }, { l: "2–3", v: 0 }, { l: "3–5", v: 0 }, { l: "> 5", v: 0 }];
    var fertig = liste.filter(function (c) { return !aktiv(c) && dauer(c) > 0; });
    fertig.forEach(function (c) {
      var m = dauer(c) / 60;
      b[m < 1 ? 0 : m < 2 ? 1 : m < 3 ? 2 : m < 5 ? 3 : 4].v++;
    });
    b.forEach(function (x) { x.s = "Min."; x.t = x.l + " Min.: " + x.v + " Anrufe"; });
    var zielDauer = box.querySelector('[data-lp="dauer"]');
    zielDauer.innerHTML = fertig.length ? LP.saeulen(b, { ziel: zielDauer, h: 176, gap: 8, titel: "Gesprächsdauer" }) : LP.leer("Noch keine beendeten Gespräche.");
    LP.beruhigen(box);
  }
  LP.beobachte(document.getElementById("rows"), zeichnen);
  LP.beobachte(document.getElementById("empty"), zeichnen);
})();
</script>{% endraw %}
