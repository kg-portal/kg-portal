<style>
  /* Leon-Reiter wie in KG Business: eine Leiste, eine Zeile (CRM-Farben) */
  .kg-leon-tabs { display:flex; align-items:center; gap:8px; margin:0 0 14px; padding:8px; background:#fff; border:1px solid #dbe3f0; border-radius:18px; overflow-x:auto; scrollbar-width:thin; font-family:Arial, Helvetica, sans-serif; }
  .kg-leon-tabs-title { display:inline-flex; align-items:center; gap:7px; padding:8px 12px 8px 6px; font-weight:900; font-size:15px; color:#1e3a8a; white-space:nowrap; border-right:2px solid #e2e8f0; margin-right:2px; }
  .kg-leon-tabs a { flex:0 0 auto; padding:9px 14px; border-radius:12px; font-weight:800; font-size:14px; color:#1e293b; text-decoration:none; white-space:nowrap; }
  .kg-leon-tabs a:hover { background:#eff6ff; color:#1e3a8a; }
  .kg-leon-tabs a.on { background:#2563eb; color:#fff; }
  @media (max-width:760px) { .kg-leon-tabs { margin-bottom:8px; border-radius:14px; } .kg-leon-tabs a { padding:8px 11px; font-size:13px; } }

  /* ===== PREMIUM (einheitliches Design) ===== */
  /* Moderne Segment-Navigation – nur Aussehen */
  @keyframes kgLeonTabsRein { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .kg-leon-tabs { gap: 4px; padding: 6px; background: #f1f5f9; border: 1px solid #e6ebf2; border-radius: 18px; box-shadow: inset 0 1px 2px rgba(15,23,42,.04), 0 18px 40px -34px rgba(15,23,42,.45); font-family: inherit; animation: kgLeonTabsRein .5s cubic-bezier(.22,1,.36,1) backwards; }
  .kg-leon-tabs-title { gap: 9px; padding: 3px 14px 3px 4px; margin-right: 4px; border-right: 1px solid #dbe3ef; font-size: 14.5px; color: #0f172a; letter-spacing: -.2px; }
  .kg-leon-tabs-title i { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 10px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; font-size: 13px; box-shadow: 0 8px 16px -8px rgba(37,99,235,.9); }
  .kg-leon-tabs a { padding: 9px 14px; border-radius: 12px; font-size: 13.5px; font-weight: 800; color: #475569; transition: translate .2s, background-color .2s, color .2s, box-shadow .2s; }
  .kg-leon-tabs a:hover { background: #ffffff; color: #1d4ed8; translate: 0 -1px; box-shadow: 0 8px 16px -12px rgba(15,23,42,.45); }
  .kg-leon-tabs a.on, .kg-leon-tabs a.on:hover { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; box-shadow: 0 10px 20px -10px rgba(37,99,235,.85); }
  @media (max-width:760px) { .kg-leon-tabs { padding: 5px; border-radius: 16px; } .kg-leon-tabs a { padding: 8px 11px; font-size: 13px; } }
  @media (prefers-reduced-motion: reduce) { .kg-leon-tabs { animation: none; } .kg-leon-tabs a { transition: none; } }
</style>
<nav class="kg-leon-tabs" aria-label="Leon">
  <span class="kg-leon-tabs-title"><i class="fa-solid fa-headset"></i> Leon</span>
  {% for key, href, label in leon_tabs %}
  <a href="{{ href }}" class="{{ 'on' if key == leon_tab else '' }}">{{ label }}</a>
  {% endfor %}
</nav>
<script>
// aktiven Reiter in den sichtbaren Bereich schieben (nur wenn die Leiste seitlich scrollt)
(function () {
    var nav = document.querySelector('.kg-leon-tabs');
    var aktiv = nav && nav.querySelector('a.on');
    if (nav && aktiv && nav.scrollWidth > nav.clientWidth) {
        nav.scrollLeft = aktiv.offsetLeft - nav.offsetLeft - (nav.clientWidth - aktiv.offsetWidth) / 2;
    }
})();
</script>
