<style>
  /* Leon-Reiter wie in KG Business: eine Leiste, eine Zeile (CRM-Farben) */
  .kg-leon-tabs { display:flex; align-items:center; gap:8px; margin:0 0 14px; padding:8px; background:#fff; border:1px solid #dbe3f0; border-radius:18px; overflow-x:auto; scrollbar-width:thin; font-family:Arial, Helvetica, sans-serif; }
  .kg-leon-tabs-title { display:inline-flex; align-items:center; gap:7px; padding:8px 12px 8px 6px; font-weight:900; font-size:15px; color:#1e3a8a; white-space:nowrap; border-right:2px solid #e2e8f0; margin-right:2px; }
  .kg-leon-tabs a { flex:0 0 auto; padding:9px 14px; border-radius:12px; font-weight:800; font-size:14px; color:#1e293b; text-decoration:none; white-space:nowrap; }
  .kg-leon-tabs a:hover { background:#eff6ff; color:#1e3a8a; }
  .kg-leon-tabs a.on { background:#2563eb; color:#fff; }
  @media (max-width:760px) { .kg-leon-tabs { margin-bottom:8px; border-radius:14px; } .kg-leon-tabs a { padding:8px 11px; font-size:13px; } }
</style>
<nav class="kg-leon-tabs" aria-label="Leon">
  <span class="kg-leon-tabs-title"><i class="fa-solid fa-headset"></i> Leon</span>
  {% for key, href, label in leon_tabs %}
  <a href="{{ href }}" class="{{ 'on' if key == leon_tab else '' }}">{{ label }}</a>
  {% endfor %}
</nav>
<script>
// aktiven Reiter in den sichtbaren Bereich schieben (nur wenn die Leiste seitlich scrollt)
(function () {
    var nav = document.querySelector('.kg-leon-tabs');
    var aktiv = nav && nav.querySelector('a.on');
    if (nav && aktiv && nav.scrollWidth > nav.clientWidth) {
        nav.scrollLeft = aktiv.offsetLeft - nav.offsetLeft - (nav.clientWidth - aktiv.offsetWidth) / 2;
    }
})();
</script>
