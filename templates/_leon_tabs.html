<style>
  /* Leon-Reiter wie in KG Business: eine Leiste, eine Zeile (CRM-Farben) */
  .kg-leon-tabs { display:flex; align-items:center; gap:8px; margin:0 0 14px; padding:8px; background:#fff; border:1px solid #dbe3f0; border-radius:18px; overflow-x:auto; scrollbar-width:thin; font-family:Arial, Helvetica, sans-serif; }
  .kg-leon-tabs-title { display:inline-flex; align-items:center; gap:7px; padding:8px 12px 8px 6px; font-weight:900; font-size:15px; color:#1e3a8a; white-space:nowrap; border-right:2px solid #e2e8f0; margin-right:2px; }
  .kg-leon-tabs a { flex:0 0 auto; padding:9px 14px; border-radius:12px; font-weight:800; font-size:14px; color:#1e293b; text-decoration:none; white-space:nowrap; }
  .kg-leon-tabs a:hover { background:#eff6ff; color:#1e3a8a; }
  .kg-leon-tabs a.on { background:#2563eb; color:#fff; }
  @media (max-width:760px) { .kg-leon-tabs { margin-bottom:8px; border-radius:14px; } .kg-leon-tabs a { padding:8px 11px; font-size:13px; } }
  /* ===== PREMIUM V2 „Graphit“ ===== */
  /* Unterstrich-Reiter: Text, aktiver Reiter mit 2px-Graphit-Linie, keine Animation */
  @media screen {
    nav.kg-leon-tabs { gap:2px; margin:0 0 20px; padding:0 2px; background:transparent; border:0; border-bottom:1px solid #e5e7eb; border-radius:0; box-shadow:none; font-family:inherit; scrollbar-width:none; }
    nav.kg-leon-tabs::-webkit-scrollbar { display:none; }
    nav.kg-leon-tabs .kg-leon-tabs-title { gap:8px; height:22px; margin:0 8px 0 0; padding:0 14px 0 0; border-right:1px solid #e5e7eb; font-size:13px; font-weight:800; color:#111827; letter-spacing:-.01em; }
    nav.kg-leon-tabs .kg-leon-tabs-title i { font-size:13px; color:#6b7280; }
    nav.kg-leon-tabs a { position:relative; margin:0 0 -1px; padding:13px 11px 12px; border-radius:0; border-bottom:2px solid transparent; background:transparent; font-size:13.5px; font-weight:600; color:#6b7280; transition:color .15s ease, border-color .15s ease; }
    nav.kg-leon-tabs a:hover { background:transparent; color:#111827; border-bottom-color:#d1d5db; }
    nav.kg-leon-tabs a.on { background:transparent; color:#111827; font-weight:700; border-bottom-color:#111827; }
    nav.kg-leon-tabs a:focus-visible { outline:2px solid #111827; outline-offset:-2px; border-radius:6px; }
    html[data-kg-x="on"] nav.kg-leon-tabs a.on { color:#e5e7eb !important; border-bottom-color:#60a5fa !important; }
    html[data-kg-x="on"] nav.kg-leon-tabs a:hover { color:#e5e7eb !important; }
    html[data-kg-x="on"] nav.kg-leon-tabs .kg-leon-tabs-title { color:#e5e7eb !important; }
    @media (max-width:760px) { nav.kg-leon-tabs { margin-bottom:14px; border-radius:0; } nav.kg-leon-tabs a { padding:11px 9px 10px; font-size:13px; } }
  }
</style>
<nav class="kg-leon-tabs" aria-label="Leon">
  <span class="kg-leon-tabs-title"><i class="fa-solid fa-headset"></i> Leon</span>
  {% for key, href, label in leon_tabs %}
  <a href="{{ href }}" class="{{ 'on' if key == leon_tab else '' }}">{{ label }}</a>
  {% endfor %}
</nav>
<script>
// aktiven Reiter in den sichtbaren Bereich schieben (nur wenn die Leiste seitlich scrollt)
(function () {
    var nav = document.querySelector('.kg-leon-tabs');
    var aktiv = nav && nav.querySelector('a.on');
    if (nav && aktiv && nav.scrollWidth > nav.clientWidth) {
        nav.scrollLeft = aktiv.offsetLeft - nav.offsetLeft - (nav.clientWidth - aktiv.offsetWidth) / 2;
    }
})();
</script>
